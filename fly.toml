app = "siwa-server"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "5s"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "/bin/sh -lc 'SIWA_RELEASE_COMMAND=migrate /app/bin/siwa_server eval SiwaServer.Release.migrate'"

[env]
  ECTO_IPV6 = "true"
  PHX_HOST = "siwa.regents.sh"
  PHX_SERVER = "true"
  PORT = "8080"
  # Public values of the one Privy app every Regent site signs people in with (the
  # app id is in each site's page; the key is its public verification key).
  PRIVY_APP_ID = "cmky518c003ngl40cc3wlyc99"
  PRIVY_VERIFICATION_KEY = "-----BEGIN PUBLIC KEY-----\nMFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEIUR2EQRL9xzLYpvbM+MTytts9OUO\n9rNWxKoJD0O3I5o7r+oIikQafRKybOG5gmoMGDsmmCryO/H77yn2RTEAjA==\n-----END PUBLIC KEY-----\n"
  SIWA_CLEANUP_BATCH_SIZE = "10000"
  # The event name of the Stripe meter SIWA bills on, the same in every Stripe account
  # (mix siwa_server.stripe_setup prints it).
  STRIPE_METER_EVENT_NAME = "siwa_active_agents"
  # Price v1 in the Stripe account STRIPE_SECRET_KEY opens, as that task prints it. This
  # one is in Stripe's test mode: no real money moves until a live key and its price replace both.
  STRIPE_PRICE_ID = "price_1UcrSfRo8Z6It8bY3sQPIqEO"
  # The sites whose pages a person may come back to from Stripe's checkout and billing pages.
  SIWA_PORTAL_ORIGINS = "https://template.regents.sh,https://regents.sh"
  SIWA_WALLET_ORIGINS = "patchbay=https://patchbay.help,patchbay=https://open.patchbay.help,regents=https://regents.sh,keyfleet=https://keyfleet.ai,keyfleet=https://regents-club.notebooks.keyfleet.ai,keyfleet=https://fleet-tech-classic.notebooks.keyfleet.ai,keyfleet=https://code.keyfleet.ai,techtree=https://techtree.sh,ash-template=https://template.regents.sh,regents-mobile=https://regents-mobile-server.fly.dev,autolaunch=https://autolaunch.sh,chainagent=https://chainagent.ai"

[metrics]
  port = 9091
  path = "/metrics"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "off"
  min_machines_running = 1
  processes = ["app"]

  # At most 200 requests reach each machine at once; Fly holds the rest.
  # A 64 KB body can still cost a few MB to decode, so 200 at once is under
  # 1 GB, inside each 2 GB machine.
  [http_service.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 150

# Fly's check reaches the machine over plain HTTP. It asks as localhost, which
# force_ssl in config/prod.exs answers instead of redirecting.
[[http_service.checks]]
  grace_period = "30s"
  interval = "10s"
  method = "GET"
  path = "/healthz"
  protocol = "http"
  timeout = "2s"

  [http_service.checks.headers]
    Host = "localhost"

# Two machines on separate hosts share nothing but the sign-in database.
[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 2048
