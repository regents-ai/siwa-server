app = "siwa-server"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "5s"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "/bin/sh -lc 'SIWA_RELEASE_COMMAND=migrate /app/bin/siwa_server eval SiwaServer.Release.migrate'"

[env]
  ECTO_IPV6 = "true"
  PHX_HOST = "siwa.regents.sh"
  PHX_SERVER = "true"
  PORT = "8080"
  SIWA_WALLET_ORIGINS = "patchbay=https://patchbay.help,regents=https://regents.sh,keyfleet=https://keyfleet.ai,techtree=https://techtree.sh,ash-template=https://template.regents.sh,regents-mobile=https://regents-mobile-server.fly.dev,autolaunch=https://autolaunch.sh"

[metrics]
  port = 9091
  path = "/metrics"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "off"
  min_machines_running = 1
  processes = ["app"]

  # At most 25 open connections reach the machine at once; Fly holds the rest.
  # A 64 KB body can still cost a few MB to decode, so 25 at once is about
  # 100 MB, well inside the 512 MB machine.
  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

# Fly's check reaches the machine over plain HTTP. It asks as localhost, which
# force_ssl in config/prod.exs answers instead of redirecting.
[[http_service.checks]]
  grace_period = "30s"
  interval = "10s"
  method = "GET"
  path = "/healthz"
  protocol = "http"
  timeout = "2s"

  [http_service.checks.headers]
    Host = "localhost"

[[mounts]]
  source = "siwa_data"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
