# What siwa-server does, the code that serves it, its risk level and the checks that prove it.
# The shape is control/verification/standard.md's. `make check` (`mix precommit`) runs every proof listed here
# except where a gap says otherwise. Almost everything here is sign-in, so most features are protected.
repo: siwa-server
features:
  - id: wallet-sign-in
    what: A wallet asks for a sign-in challenge for a site and signs it in once, for each origin the site lists.
    who: agent
    level: protected
    paths:
      - lib/siwa_server_web/wallet_siwa_controller.ex
      - lib/siwa_server/siwa/wallet.ex
      - lib/siwa_server/siwa/challenge.ex
      - lib/siwa_server/config.ex
      - lib/siwa_server/ethereum.ex
    entry:
      - route: POST /api/shared/siwa/wallet/nonce
      - route: POST /api/shared/siwa/wallet/verify
      - route: GET /api/shared/siwa/audiences
    proofs:
      - test/siwa_server_web/controllers/wallet_siwa_controller_test.exs
      - test/siwa_server/challenge_test.exs
      - test/siwa_server/wallet_concurrency_test.exs
      - test/siwa_server/wallet_origins_test.exs
      - test/siwa_server/ethereum_test.exs
      - test/siwa_server/nonce_redeem_once_property_test.exs
      - test/siwa_server/siwa_message_round_trip_property_test.exs
      - test/siwa_server/wallet_origins_property_test.exs
    regressions:
      - id: R-20261018-origin-two-spellings
        from: property test, seed 814171 (patchbay.help listed again as patchbay.help:443)
        test: test/siwa_server/wallet_origins_property_test.exs
      - id: R-20261018-numeric-origin
        from: breaker review of e75796b (https://127.0.0.1 and https://2130706433 under two audiences)
        test: test/siwa_server/wallet_origins_test.exs
    gaps:
      - No browser e2e: this is an API that agents and site servers call, not a page.
      - The sign-in message has no parser; its property proves the issued text is the only text accepted.

  - id: signed-request-check
    what: A site asks whether a signed agent request is genuine (window, body, path and query, audience, receipt, used once).
    who: agent
    level: protected
    paths:
      - lib/siwa_server_web/agent_siwa_controller.ex
      - lib/siwa_server/siwa/http_verifier.ex
      - lib/siwa_server/siwa/replay_store.ex
      - priv/repo/migrations/20261113150000_hash_request_replay_keys.exs
    entry:
      - route: POST /api/shared/siwa/http-verify
    proofs:
      - test/siwa_server_web/controllers/agent_siwa_controller_test.exs
      - test/siwa_server/first_signed_request_test.exs
      - test/siwa_server/http_verifier_test.exs
      - test/siwa_server/replay_store_test.exs
      - test/siwa_server/replay_store_commit_test.exs
      - test/siwa_server/replay_window_property_test.exs
      - test/siwa_server/replay_key_hash_test.exs
    gaps:
      - No browser e2e: API only.
      - The window property reads the real clock around each check; the verifier takes no clock of its own.

  - id: refusal-help
    what: Every refusal tells the agent what to do next, in words shaped by the site and how it signs.
    who: agent
    level: ordinary
    paths:
      - lib/siwa_server_web/help.ex
      - lib/siwa_server_web/fallback_controller.ex
      - lib/siwa_server_web/controllers/error_json.ex
    proofs:
      - test/siwa_server_web/controllers/agent_siwa_controller_test.exs
      - test/siwa_server_web/controllers/error_json_test.exs
    regressions:
      - id: R-20261018-bad-signature-said-missing
        from: Sentinel task, control e115e3d1
        test: test/siwa_server_web/controllers/agent_siwa_controller_test.exs

  - id: agent-registry-listing
    what: An agent lists itself in the agent registry on Base, and its profile is served, or links a listing made with another tool that the registry names its own.
    who: agent
    level: protected
    paths:
      - lib/siwa_server_web/agent_registration_controller.ex
      - lib/siwa_server/agent_registration.ex
      - lib/siwa_server/agent_registration/link.ex
      - lib/siwa_server/agent_registration/owner_check_worker.ex
      - lib/siwa_server/siwa/challenge.ex
    entry:
      - route: POST /api/shared/siwa/agent/register-step
      - route: POST /api/shared/siwa/agent/registered
      - route: POST /api/shared/siwa/agent/link-challenge
      - route: POST /api/shared/siwa/agent/link
      - route: GET /agent-profiles/:profile_id
    proofs:
      - test/siwa_server_web/controllers/agent_registration_controller_test.exs
      - test/siwa_server/owner_check_worker_test.exs
    gaps:
      - No property proof that only a successful registration transaction for this wallet is accepted.

  - id: agent-book-person
    what: An agent accepts the person World ID's AgentBook names behind its wallet, once and for good.
    who: agent
    level: protected
    paths:
      - lib/siwa_server_web/agent_book_controller.ex
      - lib/siwa_server/agent_book.ex
      - lib/siwa_server/siwa/challenge.ex
    entry:
      - route: POST /api/shared/siwa/agent-book/challenge
      - route: POST /api/shared/siwa/agent-book/accept
    proofs:
      - test/siwa_server_web/controllers/agent_book_controller_test.exs
      - test/siwa_server/agent_book_test.exs
    gaps:
      - No property proof that a second acceptance never replaces the first.

  - id: site-activity-read
    what: A Regent site reads one wallet's activity, registry listing and AgentBook person with its own reader key.
    who: operator
    level: protected
    paths:
      - lib/siwa_server_web/activity_controller.ex
      - lib/siwa_server/config.ex
      - lib/siwa_server/siwa/activity_store.ex
    entry:
      - route: POST /api/shared/siwa/activity
    proofs:
      - test/siwa_server_web/controllers/activity_controller_test.exs
      - test/siwa_server/config_test.exs
    gaps:
      - No property proof that one site's key never reads under another site's name.

  - id: hosted-requests
    what: Each site's hosted connection (Patchbay's ChatGPT app, and Keyfleet's, the template's and Chainagent's Claude connectors) signs only that site's approved requests, with that site's own key.
    who: operator
    level: protected
    paths:
      - lib/siwa_server_web/hosted_controller.ex
      - lib/siwa_server/hosted_requests.ex
      - lib/siwa_server/config.ex
    entry:
      - route: POST /api/shared/siwa/hosted
    proofs:
      - test/siwa_server/hosted_requests_test.exs
    gaps:
      - No property proof that a hosted signer never signs for another audience.

  - id: request-handling
    what: Every request is parsed and routed the same way.
    who: agent
    level: protected
    paths:
      - lib/siwa_server_web.ex
      - lib/siwa_server_web/endpoint.ex
    proofs:
      - test/siwa_server_web/controllers/agent_siwa_controller_test.exs

  - id: rate-limits
    what: Requests are limited per wallet, chain, audience and address, and each computer has one ceiling across the wallets it names (its own, higher one for http-verify), with a wait in Retry-After.
    who: agent
    level: protected
    paths:
      - lib/siwa_server_web/plugs/rate_limit.ex
      - lib/siwa_server/rate_limiter.ex
      - lib/siwa_server_web/router.ex
    proofs:
      - test/siwa_server_web/plugs/rate_limit_test.exs
      - test/siwa_server_web/controllers/control_session_controller_test.exs

  - id: agent-helpers
    what: The Python and Node helpers sign in, sign each request fresh and show one help screen; help anywhere runs nothing.
    who: agent
    level: protected
    paths:
      - priv/static/agent/siwa_agent.py
      - priv/static/agent/siwa-agent.mjs
      - priv/static/agent/siwa-contract.json
      - priv/static/skill.md
      - lib/mix/tasks/siwa_server.agent_clients.ex
    entry:
      - cli: uv run siwa_agent.py
      - cli: node siwa-agent.mjs
    proofs:
      - test/siwa_server/agent_clients_conformance_test.exs
      - test/siwa_server/first_signed_request_test.exs
      - e2e/touch-id-page.spec.mjs
    regressions:
      - id: R-20261028-first-signed-request-unproven
        from: new-agent walk 27 Oct (a fresh agent set up and paired; its first signed request was never shown to pass a site's check)
        test: test/siwa_server/first_signed_request_test.exs
    gaps:
      - The first-request walk starts from the key file keygen writes off a Mac; a Mac's Touch ID lock is walked by e2e/touch-id-page.spec.mjs.

  - id: touch-id-page
    what: A person confirms with Touch ID to protect, unlock or show their agent's key, on a page their agent opens.
    who: person
    level: protected
    paths:
      - assets/agent/passkey.js
      - scripts/build_agent_page.py
    proofs:
      - e2e/touch-id-page.spec.mjs
      - e2e/playwright.config.mjs
    gaps:
      - scripts/build_agent_page.py --check needs the design-system checkout, so it is run by hand, not in precommit.
      - The real-helper run needs a Mac.
      - WebKit not run on the Mac (Safari).

  - id: control-sign-in
    what: A Regent site trades its signed-in person's Privy sign-in for a 15-minute control token naming only that person; without the Privy settings the control API refuses and the rest of the service runs.
    who: person
    level: protected
    paths:
      - lib/siwa_server_web/control_session_controller.ex
      - lib/siwa_server_web/control_token.ex
      - lib/siwa_server_web/plugs/control_configured.ex
      - lib/siwa_server_web/plugs/control_person.ex
      - lib/siwa_server/config.ex
      - config/runtime.exs
    entry:
      - route: POST /api/control/v1/session
    proofs:
      - test/siwa_server_web/controllers/control_session_controller_test.exs
      - test/siwa_server/config_test.exs
    gaps:
      - No browser e2e: no site calls it yet. The Privy tokens in the tests are made the way Privy makes them, with a test key, not by Privy.

  - id: customer-sites-and-keys
    what: A person makes their customer, adds sites with an audience no one else has and origins their environment allows, and makes, lists and revokes each site's server keys, shown once and kept only as a hash; nobody reaches another person's records.
    who: person
    level: protected
    paths:
      - lib/siwa_server/customers.ex
      - lib/siwa_server/customers/**
      - lib/siwa_server_web/control_controller.ex
      - lib/siwa_server_web/fallback_controller.ex
      - priv/repo/migrations/20261114120000_create_customers_sites_and_site_credentials.exs
    entry:
      - route: GET /api/control/v1/account
      - route: POST /api/control/v1/customer
      - route: PATCH /api/control/v1/customer
      - route: GET /api/control/v1/sites
      - route: POST /api/control/v1/sites
      - route: GET /api/control/v1/sites/{id}
      - route: PATCH /api/control/v1/sites/{id}
      - route: DELETE /api/control/v1/sites/{id}
      - route: GET /api/control/v1/sites/{id}/keys
      - route: POST /api/control/v1/sites/{id}/keys
      - route: DELETE /api/control/v1/sites/{id}/keys/{key_id}
    proofs:
      - test/siwa_server_web/controllers/control_controller_test.exs
      - test/siwa_server/customers_concurrency_test.exs
    gaps:
      - Nothing calls a server key yet (SiwaServer.Customers.site_for_key/1 is tested, not used), and nothing proves a production site's origins, so originProof stays unverified.
      - The database's own rules (one customer per person, one site per audience, 1 to 10 distinct origins, proof only for production, key hash and prefix shape) were walked by hand in psql on 14 Nov 2026; no test breaks them directly.
      - No property test over audience and origin spellings of its own; the https:// origin rule is the one SIWA_WALLET_ORIGINS uses, whose property test covers lookalikes.

  - id: discovery-and-readiness
    what: The service describes itself, says when it is ready and which checks failed, and serves its contract and the websites guide.
    who: operator
    level: ordinary
    paths:
      - lib/siwa_server_web/discovery_controller.ex
      - lib/siwa_server/readiness.ex
      - lib/mix/tasks/siwa_server.contract_check.ex
      - lib/siwa_server_web/metrics.ex
      - lib/siwa_server_web/telemetry.ex
      - priv/static/regent-services-contract.openapiv3.yaml
      - priv/static/websites.md
    entry:
      - route: GET /
      - route: GET /websites.md
      - route: GET /healthz
      - route: GET /readyz
      - route: GET /regent-services-contract.openapiv3.yaml
    proofs:
      - test/siwa_server/readiness_test.exs
      - test/siwa_server_web/controllers/agent_siwa_controller_test.exs

  - id: cleanup
    what: Expired challenges and used requests are removed in batches.
    who: operator
    level: ordinary
    paths:
      - lib/siwa_server/siwa/cleanup_worker.ex
    proofs:
      - test/siwa_server/cleanup_worker_test.exs

  - id: configuration
    what: Settings and secrets stay inside this repository's list, and the database settings fit Fly's managed Postgres.
    who: operator
    level: protected
    paths:
      - config/**
      - lib/siwa_server/config.ex
      - lib/siwa_server/database_config.ex
      - lib/siwa_server/repo.ex
      - lib/siwa_server/application.ex
      - lib/siwa_server/release.ex
      - fly.toml
      - Dockerfile
      - priv/repo/migrations/**
      - .env.example
      - docs/secret-allowlist.yaml
    proofs:
      - test/siwa_server/config_test.exs
      - test/siwa_server/secret_allowlist_test.exs
      - test/siwa_server/database_config_test.exs
    regressions:
      - id: R-20261020-settings-missing-from-example
        from: repo review 20 Oct 2026 (WORLD_RPC_URL, SIWA_HOSTED_SIGNERS, KEYSTORE_PATH and KEYSTORE_BACKEND read but not in .env.example); the test reads config/runtime.exs and lib/**/*.ex
        test: test/siwa_server/secret_allowlist_test.exs

  - id: release
    what: An operator releases one commit of origin/main to Fly and checks it is live, ready and serving the helpers in git.
    who: operator
    level: protected
    paths:
      - scripts/deploy.sh
      - Makefile
      - .tool-versions
    proofs:
      - scripts/deploy.sh
    gaps:
      - The script is never run by a check; its own checks after the deploy (exactly two machines on the commit, /readyz, served sha256) are the proof, at release time. It was walked once with a stand-in fly and curl (27 Oct 2026), not against Fly.
      - The hosted connection key restore in README.md has never been rehearsed.
