openapi: 3.1.0
info:
  title: Regent Shared Services Contract
  version: 0.2.0
  description: >
    Source-of-truth contract for shared Regent HTTP services. Shared SIWA routes
    own signed identity proof, agent registration on Base, request verification,
    health and contract discovery.
x-regent-capability:
  status: beta
  owner: shared-services
  money_path: true
  cli_surface: true
  mobile_surface: false
x-regent-rate-limits:
  retry_after_header: Retry-After
  tiers:
    public_unauthenticated: strict bootstrap limits before SIWA identity is proven
    verified_cli_signed_agent: higher allowance after SIWA receipt or HTTP signature verification
  cli_allowance_requires_verified_siwa: true
tags:
  - name: auth
  - name: internal
paths:
  /:
    get:
      operationId: siwaServerRoot
      tags: [auth]
      responses:
        "200":
          description: Plain text naming the agent guide at /skill.md
          content:
            text/plain:
              schema:
                type: string
  /healthz:
    get:
      operationId: siwaServerHealthz
      tags: [auth]
      responses:
        "200":
          description: Simple health check response for the shared SIWA server
          content:
            text/plain:
              schema:
                type: string
  /readyz:
    get:
      operationId: siwaServerReadyz
      tags: [auth]
      responses:
        "200":
          description: Readiness checks passed for the shared SIWA server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: One or more readiness checks failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
  /regent-services-contract.openapiv3.yaml:
    get:
      operationId: regentServicesContractSource
      tags: [auth]
      responses:
        "200":
          description: Source-of-truth contract served by the shared SIWA server
          content:
            application/yaml:
              schema:
                type: string
  /api/shared/siwa/audiences:
    get:
      operationId: listSharedWalletSiwaAudiences
      tags: [auth]
      description: List the sites an agent can sign in to with its own key, one row for each origin that signs in for an audience. An audience can have several origins. An agent matches the site it is calling to an origin here to learn which audience to sign in for.
      responses:
        "200":
          description: Audiences open to wallet sign-in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletSiwaAudiencesResponse"
  /api/shared/siwa/wallet/nonce:
    post:
      operationId: createSharedWalletSiwaNonce
      tags: [auth]
      description: Issue a single-use ERC-4361 wallet challenge for an enabled audience. Ordinary wallets, and smart wallets on Ethereum or Base, can sign it. No private key is accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletSiwaNonceRequest"
      responses:
        "200":
          description: Issue a single-use ERC-4361 wallet challenge for an enabled audience
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletSiwaNonceResponse"
        "400":
          description: Malformed wallet request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Invalid signature, canonical message or expired challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Wallet audience is not enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Challenge absent or already consumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: Request body too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "415":
          description: Unsupported content type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Wallet verification unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimitError"
  /api/shared/siwa/wallet/verify:
    post:
      operationId: verifySharedWalletSiwaSession
      tags: [auth]
      description: Verify wallet control without asserting human identity or agent registration. A smart wallet's signature is checked on the chain it signs in on with ERC-1271, wrapped with ERC-6492 before the wallet is deployed. The answer says which method proved the wallet. No private key is accepted.
      parameters:
        - in: header
          name: x-agent-signer
          required: false
          schema:
            type: string
          description: How the agent signs, used only to word the hint on a refusal. `own-key` when the agent client keeps the key, or the name of the agent's own signer command, such as `cast`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletSiwaVerifyRequest"
      responses:
        "200":
          description: Verify wallet control without asserting human identity or agent registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletSiwaVerifyResponse"
        "400":
          description: Malformed wallet request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Invalid signature, canonical message or expired challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Wallet audience is not enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Challenge absent or already consumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: Request body too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "415":
          description: Unsupported content type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Wallet verification unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Smart wallet signature lookup on the chain it signed in on failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimitError"
  /api/shared/siwa/http-verify:
    post:
      operationId: verifySharedSiwaHttpEnvelope
      tags: [auth]
      parameters:
        - in: header
          name: x-siwa-audience
          required: true
          schema:
            type: string
          description: App audience that the SIWA receipt must match for this protected request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiwaHttpVerifyRequest"
      responses:
        "200":
          description: Protected request envelope verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletSiwaHttpVerifyResponse"
        "400":
          description: Invalid envelope request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Envelope verification failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Request replay detected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: SIWA protected request envelope is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "415":
          description: SIWA protected request content type is unsupported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: SIWA HTTP verification is not configured, or the verified request could not be recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Smart wallet signature lookup on Base failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimitError"
  /api/shared/siwa/activity:
    post:
      operationId: readSharedSiwaActivity
      summary: Read how much one wallet's agent was verified at each Regents site each day
      description: >-
        Returns one line for each site and UTC day on which
        /api/shared/siwa/http-verify verified a request for the wallet over the
        last 30 days, newest day first. Each line names the audience, the day,
        how many requests were verified, how many of them began a lease, and when
        the first and the last of them was verified. Reads a site checks itself
        on a lease never reach this server and are not counted. The lines say what arrived for the wallet at a site.
        Methods, paths, request bodies, headers, receipts and signatures are
        never kept. agentRegistration is the wallet's newest agent registry listing made
        through this server, or null, the same as http-verify returns. agentBook is
        the World ID-verified person the wallet accepted, for good, or null, the
        same as http-verify returns.
      tags: [internal]
      security:
        - ActivityReadToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiwaActivityRequest"
      responses:
        "200":
          description: The wallet's recent verified requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiwaActivityResponse"
        "400":
          description: Invalid activity request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: The activity read token was absent or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: Activity request is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "415":
          description: Activity request content type is unsupported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimitError"
  /api/shared/siwa/hosted:
    post:
      operationId: siwaHostedAgentRequest
      tags: [internal]
      description: >
        Register the persistent signer for one of the calling site's account
        connections, or sign one of that site's own identity or pairing requests
        for it (Patchbay's ChatGPT app may also send its two MCP tools).
        The site asks with its own hosted signing key, which works only here;
        everything signed is bound to that site's audience, and a connection key
        reaches only the signer the same site registered. Does not expose keys or
        sign payments, transactions or arbitrary messages.
      security:
        - HostedSigningKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operation, identity_key]
              additionalProperties: false
              properties:
                operation:
                  type: string
                  enum: [register, sign]
                identity_key:
                  type: string
                  pattern: '^[a-f0-9]{64}$'
                  description: Site-derived stable account connection key; never a chat identifier.
                request:
                  type: object
                  required: [method, path]
                  additionalProperties: false
                  properties:
                    method:
                      type: string
                      enum: [GET, POST]
                    path:
                      type: string
                      enum: [/api/agents/v1/whoami, /api/agents/v1/me, /api/agents/v1/pair, /chatgpt/agent/mcp]
                    body:
                      type: string
                      maxLength: 32768
                      description: Exact request bytes. MCP bodies permit ask_question and post_reply only, and only for Patchbay.
      responses:
        "200":
          description: Public signer address, or a signed envelope for the calling site only.
          content:
            application/json:
              schema:
                type: object
        "400":
          description: The body is not JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: No site's hosted signing key was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: Request exceeds the bounded body size.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "415":
          description: Unsupported content type.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Unsupported operation, unknown connection or signing refused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimitError"
  /api/shared/siwa/agent/register-step:
    post:
      operationId: buildAgentRegistrationStep
      summary: Build the transaction that lists an agent in the Base agent registry
      description: >-
        Optional; sign-in never needs it. Returns the unsigned transaction a
        wallet sends to list itself in the Base ERC-8004 agent registry
        0x8004a169fb4a3325136eb29fa0ceb6d2e539a432: register(agentUri), where
        agentUri is the agent's public profile on this server. The URI names a
        digest of the wallet, name, description and image, so sending the
        transaction is consent to exactly that profile. The wallet pays the gas;
        this server never sends or funds a transaction. Nothing is stored.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentRegisterStepRequest"
      responses:
        "200":
          description: The registration transaction for the wallet to send
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRegisterStepResponse"
        "400":
          description: Invalid registration request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: Registration request body is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "415":
          description: Registration request content type is unsupported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimitError"
  /api/shared/siwa/agent/registered:
    post:
      operationId: readAgentRegistration
      summary: Read what a sent registration did on Base
      description: >-
        Reads the transaction at the latest Base block. It must be the wallet's
        registration exactly as register-step built it for the same name,
        description and image. Until its receipt exists the answer is
        registration_pending; ask again after a couple of seconds. Once it lands
        the registration is kept: the profile is served at its agentUri, and
        /api/shared/siwa/http-verify names it in agentRegistration for the
        wallet's signed requests.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentRegisteredRequest"
      responses:
        "200":
          description: The registration is still pending, or the agent is registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRegisteredResponse"
        "400":
          description: Invalid registration request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: Registration request body is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "415":
          description: Registration request content type is unsupported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: The transaction reverted, or is not this wallet's registration of this profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimitError"
        "502":
          description: Base could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/shared/siwa/agent-book/challenge:
    post:
      operationId: createAgentBookChallenge
      tags: [auth]
      description: "Read the person World's AgentBook names behind the wallet now and issue a single-use message, valid for five minutes, for the wallet to sign to accept that person. A wallet accepts once: sites show the accepted person for good, whatever AgentBook names later."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentBookChallengeRequest"
      responses:
        "200":
          description: The person AgentBook names now and the message to sign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentBookChallengeResponse"
        "400":
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: World's AgentBook names no person behind this wallet (not_in_agent_book)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: The wallet has already accepted its person, for good (agent_book_already_accepted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: Request body too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "415":
          description: Unsupported content type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: World's AgentBook could not be read (agent_book_unavailable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimitError"
  /api/shared/siwa/agent-book/accept:
    post:
      operationId: acceptAgentBookHuman
      tags: [auth]
      description: Accept the person named in a challenge from /api/shared/siwa/agent-book/challenge. The wallet signs the exact message; ordinary wallets, and smart wallets on Ethereum or Base, can sign it. The person is kept, for good, only when World's AgentBook still names them and the wallet has not accepted a person before. No private key is accepted.
      parameters:
        - in: header
          name: x-agent-signer
          required: false
          schema:
            type: string
          description: How the agent signs, used only to word the hint on a refusal. `own-key` when the agent client keeps the key, or the name of the agent's own signer command, such as `cast`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentBookAcceptRequest"
      responses:
        "200":
          description: The wallet accepted the person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentBookAcceptResponse"
        "400":
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Invalid signature, changed message or expired challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Challenge absent or already used, or AgentBook names no person behind the wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: AgentBook names a different person than the challenge did (agent_book_changed), or the wallet has already accepted its person (agent_book_already_accepted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: Request body too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "415":
          description: Unsupported content type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: World's AgentBook, or a smart wallet's signature on the chain it signed on, could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimitError"
  /agent-profiles/{profile_id}:
    get:
      operationId: readAgentProfile
      summary: The registration file of an agent listed through this server
      description: >-
        The ERC-8004 registration file an agent's registry entry points to.
        Served once a registration of it has landed; anyone may read it.
      tags: [auth]
      parameters:
        - in: path
          name: profile_id
          required: true
          schema:
            type: string
            pattern: "^[0-9a-f]{32}$"
      responses:
        "200":
          description: The agent's registration file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentProfile"
        "404":
          description: No registered agent has this profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimitError"
components:
  securitySchemes:
    ActivityReadToken:
      type: http
      scheme: bearer
      description: Shared token, held only by Regents sites, that permits reading verified-request activity.
    HostedSigningKey:
      type: http
      scheme: bearer
      description: A site's own key for hosted signing, one per site (SIWA_HOSTED_SIGNERS); it opens no other route.
  responses:
    RateLimitError:
      description: Too many requests
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    Address:
      type: string
      pattern: "^0x[a-fA-F0-9]{40}$"
    BaseChainId:
      type: integer
      enum: [8453]
    WalletChainId:
      type: integer
      enum: [1, 8453]
      description: The chain the wallet signs in on, Ethereum (1) or Base (8453). An ordinary wallet's signature holds on every chain; a smart wallet's is checked on this chain.
    VerificationMethod:
      type: string
      enum: [eoa_recovery, erc1271, erc6492]
      description: How the wallet's signature was proven. eoa_recovery holds on every chain; erc1271 and erc6492 hold on the chain named by chainId only.
    HexData:
      type: string
      pattern: "^0x[a-fA-F0-9]*$"
    WalletSiwaNonceRequest:
      type: object
      required: [wallet_address, chain_id, audience]
      properties:
        wallet_address:
          $ref: "#/components/schemas/Address"
        chain_id:
          $ref: "#/components/schemas/WalletChainId"
        audience:
          type: string
          minLength: 1
          maxLength: 200
      additionalProperties: false
    WalletSiwaVerifyRequest:
      type: object
      required: [wallet_address, chain_id, audience, nonce, message, signature]
      properties:
        wallet_address:
          $ref: "#/components/schemas/Address"
        chain_id:
          $ref: "#/components/schemas/WalletChainId"
        audience:
          type: string
          minLength: 1
          maxLength: 200
        nonce:
          type: string
          pattern: '^[a-f0-9]{32}$'
        message:
          type: string
          maxLength: 2048
          description: Exact server-issued ERC-4361 message; do not reconstruct it from caller fields.
        signature:
          type: string
          pattern: '^0x([a-fA-F0-9]{2})+$'
          maxLength: 8194
          description: ERC-191 personal signature from the wallet, or a smart wallet's ERC-1271 signature (ERC-6492-wrapped before deployment); never a private key.
      additionalProperties: false
    WalletSiwaAudiencesResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: string
          enum: [audiences]
        data:
          type: object
          required: [audiences]
          properties:
            audiences:
              type: array
              items:
                type: object
                required: [audience, origin]
                properties:
                  audience:
                    type: string
                  origin:
                    type: string
                    format: uri
                additionalProperties: false
          additionalProperties: false
      additionalProperties: false
    WalletSiwaNonceResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: string
          enum: [nonce_issued]
        data:
          type: object
          required: [walletAddress, chainId, audience, nonce, message, issuedAt, expiresAt]
          properties:
            walletAddress:
              $ref: "#/components/schemas/Address"
            chainId:
              $ref: "#/components/schemas/WalletChainId"
            audience:
              type: string
            nonce:
              type: string
            message:
              type: string
              description: Canonical server-issued ERC-4361 message to review and sign.
            issuedAt:
              type: string
              format: date-time
            expiresAt:
              type: string
              format: date-time
          additionalProperties: false
      additionalProperties: false
    WalletSiwaVerifyResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: string
          enum: [wallet_verified]
        data:
          type: object
          required: [verified, walletAddress, chainId, audience, keyId, signatureScheme, verificationMethod, proof, receipt, receiptExpiresAt]
          properties:
            verified:
              type: boolean
              enum: [true]
            walletAddress:
              $ref: "#/components/schemas/Address"
            chainId:
              $ref: "#/components/schemas/WalletChainId"
            audience:
              type: string
            keyId:
              type: string
            signatureScheme:
              type: string
              enum: [evm_personal_sign]
            verificationMethod:
              $ref: "#/components/schemas/VerificationMethod"
            proof:
              type: string
              enum: [wallet_signature]
            receipt:
              type: string
              description: Short-lived siwa_wallet_receipt bound to address, chain and audience. It proves neither registry ownership nor human Privy identity.
            receiptExpiresAt:
              type: string
              format: date-time
          additionalProperties: false
      additionalProperties: false
    WalletPrincipal:
      type: object
      required: [kind, wallet_address, chain_id, audience]
      properties:
        kind:
          type: string
          enum: [wallet]
        wallet_address:
          $ref: "#/components/schemas/Address"
        chain_id:
          $ref: "#/components/schemas/WalletChainId"
        audience:
          type: string
      additionalProperties: false
    WalletSiwaHttpVerifyResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: string
          enum: [http_envelope_valid]
        data:
          type: object
          required: [verified, walletAddress, chainId, keyId, verificationMethod, principal, receiptExpiresAt, requiredHeaders, requiredCoveredComponents, coveredComponents, agentRegistration, agentBook]
          properties:
            verified:
              type: boolean
              enum: [true]
            walletAddress:
              $ref: "#/components/schemas/Address"
            chainId:
              $ref: "#/components/schemas/WalletChainId"
            keyId:
              type: string
            verificationMethod:
              $ref: "#/components/schemas/VerificationMethod"
            principal:
              $ref: "#/components/schemas/WalletPrincipal"
            agentRegistration:
              description: The wallet's newest listing in the Base agent registry made through this server, or null.
              oneOf:
                - $ref: "#/components/schemas/AgentRegistration"
                - type: "null"
            agentBook:
              description: The World ID-verified person this wallet accepted, for good; otherwise null. Each site decides when to show humanId.
              oneOf:
                - $ref: "#/components/schemas/AgentBookHuman"
                - type: "null"
            receiptExpiresAt:
              type: string
              format: date-time
            requiredHeaders:
              type: array
              items:
                type: string
            requiredCoveredComponents:
              type: array
              items:
                type: string
            coveredComponents:
              type: array
              items:
                type: string
            leaseExpiresAt:
              description: Sent only when the site asked for a lease and the wallet signed with its own key. Until then the site checks this agent's read-only requests under the same receipt itself. Never after receiptExpiresAt.
              type: string
              format: date-time
          additionalProperties: false
      additionalProperties: false
    SiwaHttpVerifyRequest:
      type: object
      required: [method, path, headers]
      properties:
        method:
          type: string
        path:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
        body_digest:
          description: The content-digest of the body the site read (sha-256=:<base64>:), sent only when the request had a body. The body itself is never sent.
          type: string
        lease:
          description: True only on a request that changes nothing and spends nothing. Asks for a lease, answered with leaseExpiresAt when the wallet signed with its own key.
          type: boolean
      additionalProperties: false
    AgentProfileFields:
      type: object
      required: [name, description]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          minLength: 1
          maxLength: 1000
        image:
          type: string
          maxLength: 500
          pattern: "^https://\\S+$"
    AgentRegisterStepRequest:
      allOf:
        - $ref: "#/components/schemas/AgentProfileFields"
        - type: object
          required: [wallet_address]
          properties:
            wallet_address:
              $ref: "#/components/schemas/Address"
      unevaluatedProperties: false
    AgentRegisterStepResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: string
          enum: [registration_step]
        data:
          type: object
          required: [chainId, from, to, data, value, agentUri]
          properties:
            chainId:
              $ref: "#/components/schemas/BaseChainId"
            from:
              $ref: "#/components/schemas/Address"
            to:
              $ref: "#/components/schemas/Address"
            data:
              $ref: "#/components/schemas/HexData"
            value:
              $ref: "#/components/schemas/HexData"
            agentUri:
              type: string
              format: uri
          additionalProperties: false
      additionalProperties: false
    AgentRegisteredRequest:
      allOf:
        - $ref: "#/components/schemas/AgentProfileFields"
        - type: object
          required: [wallet_address, tx_hash]
          properties:
            wallet_address:
              $ref: "#/components/schemas/Address"
            tx_hash:
              type: string
              pattern: "^0x[a-fA-F0-9]{64}$"
      unevaluatedProperties: false
    AgentRegistration:
      type: object
      description: An agent's entry in the Base agent registry, made through this server. Sites link to registryUrl.
      required: [agentId, tokenId, profileUrl, registryUrl]
      properties:
        agentId:
          type: string
          description: eip155:8453:<registry address>:<token id>
        tokenId:
          type: string
        profileUrl:
          type: string
          format: uri
        registryUrl:
          type: string
          format: uri
      additionalProperties: false
    AgentBookHuman:
      type: object
      description: A World ID-verified person stands behind this agent wallet in World's AgentBook (World Chain, 0xA23aB2712eA7BBa896930544C7d6636a96b944dA), and the wallet accepted that person, for good, through /api/shared/siwa/agent-book/accept.
      required: [humanId, agentCount]
      properties:
        humanId:
          type: string
          pattern: "^0x[0-9a-f]{64}$"
          description: The person's anonymous World ID number (nullifier hash). The same person's agents share it.
        agentCount:
          type: integer
          minimum: 1
          description: How many agent wallets, this one included, have accepted this same person. Counts only wallets that have signed in through this server.
      additionalProperties: false
    AgentBookChallengeRequest:
      type: object
      required: [wallet_address, chain_id]
      properties:
        wallet_address:
          $ref: "#/components/schemas/Address"
        chain_id:
          $ref: "#/components/schemas/WalletChainId"
      additionalProperties: false
    AgentBookChallengeResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: string
          enum: [agent_book_challenge]
        data:
          type: object
          required: [walletAddress, chainId, humanId, nonce, message, issuedAt, expiresAt]
          properties:
            walletAddress:
              $ref: "#/components/schemas/Address"
            chainId:
              $ref: "#/components/schemas/WalletChainId"
            humanId:
              type: string
              pattern: "^0x[0-9a-f]{64}$"
              description: The person World's AgentBook names behind the wallet now. Check it is your person's number before signing.
            nonce:
              type: string
            message:
              type: string
              description: Server-issued message naming the wallet and the person, to review and sign unchanged.
            issuedAt:
              type: string
              format: date-time
            expiresAt:
              type: string
              format: date-time
          additionalProperties: false
      additionalProperties: false
    AgentBookAcceptRequest:
      type: object
      required: [wallet_address, chain_id, nonce, message, signature]
      properties:
        wallet_address:
          $ref: "#/components/schemas/Address"
        chain_id:
          $ref: "#/components/schemas/WalletChainId"
        nonce:
          type: string
          pattern: '^[a-f0-9]{32}$'
        message:
          type: string
          maxLength: 2048
          description: Exact server-issued challenge message.
        signature:
          type: string
          pattern: '^0x([a-fA-F0-9]{2})+$'
          maxLength: 8194
          description: ERC-191 personal signature from the wallet, or a smart wallet's ERC-1271 signature (ERC-6492-wrapped before deployment); never a private key.
      additionalProperties: false
    AgentBookAcceptResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: string
          enum: [agent_book_accepted]
        data:
          type: object
          required: [walletAddress, humanId]
          properties:
            walletAddress:
              $ref: "#/components/schemas/Address"
            humanId:
              type: string
              pattern: "^0x[0-9a-f]{64}$"
          additionalProperties: false
      additionalProperties: false
    AgentRegisteredResponse:
      oneOf:
        - type: object
          required: [code, data]
          properties:
            code:
              type: string
              enum: [registration_pending]
            data:
              type: object
              required: [txHash]
              properties:
                txHash:
                  type: string
              additionalProperties: false
          additionalProperties: false
        - type: object
          required: [code, data]
          properties:
            code:
              type: string
              enum: [agent_registered]
            data:
              allOf:
                - $ref: "#/components/schemas/AgentRegistration"
                - type: object
                  required: [txHash, walletAddress, chainId, registryAddress]
                  properties:
                    txHash:
                      type: string
                    walletAddress:
                      $ref: "#/components/schemas/Address"
                    chainId:
                      $ref: "#/components/schemas/BaseChainId"
                    registryAddress:
                      $ref: "#/components/schemas/Address"
              unevaluatedProperties: false
          additionalProperties: false
    AgentProfile:
      type: object
      description: ERC-8004 registration file (registration-v1).
      required: [type, name, description, image, services, x402Support, active, registrations]
      properties:
        type:
          type: string
          enum: ["https://eips.ethereum.org/EIPS/eip-8004#registration-v1"]
        name:
          type: string
        description:
          type: string
        image:
          type: string
        services:
          type: array
          items:
            type: object
        x402Support:
          type: boolean
        active:
          type: boolean
        registrations:
          type: array
          items:
            type: object
            required: [agentId, agentRegistry]
            properties:
              agentId:
                type: integer
              agentRegistry:
                type: string
            additionalProperties: false
      additionalProperties: false
    ReadinessResponse:
      type: object
      required: [ready, checks]
      properties:
        ready:
          type: boolean
        checks:
          type: object
          required:
            - database
            - endpoint_secret
            - receipt_secret
            - keyring_backend
            - keyring_password
            - keystore_path
            - base_rpc_url
            - base_rpc_chain_id
            - ethereum_rpc_url
            - ethereum_rpc_chain_id
          properties:
            database:
              type: boolean
            endpoint_secret:
              type: boolean
            receipt_secret:
              type: boolean
            keyring_backend:
              type: boolean
            keyring_password:
              type: boolean
            keystore_path:
              type: boolean
            base_rpc_url:
              type: boolean
            base_rpc_chain_id:
              type: boolean
            ethereum_rpc_url:
              type: boolean
            ethereum_rpc_chain_id:
              type: boolean
          additionalProperties: false
      additionalProperties: false
    LooseObject:
      type: object
      additionalProperties: true
    ServiceError:
      type: object
      required: [code, message]
      additionalProperties: true
      properties:
        code:
          type: string
        message:
          type: string
        hint:
          type: string
          description: >-
            What the agent should do next. Every SIWA refusal carries one, shaped by the
            site named in the request and, when signing in, by the agent's advisory
            `x-agent-signer` header.
    SiwaActivityRequest:
      type: object
      additionalProperties: false
      required: [wallet_address, since]
      properties:
        wallet_address:
          $ref: "#/components/schemas/Address"
        since:
          type: string
          format: date-time
          description: Only days whose last verified request was at or after this time are returned.
    SiwaActivityResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [days, agentRegistration, agentBook]
          properties:
            days:
              type: array
              items:
                $ref: "#/components/schemas/SiwaActivityDay"
            agentRegistration:
              description: The wallet's newest listing in the Base agent registry made through this server, or null.
              oneOf:
                - $ref: "#/components/schemas/AgentRegistration"
                - type: "null"
            agentBook:
              description: The World ID-verified person World's AgentBook last named behind the wallet, when the wallet accepted that same person; otherwise null.
              oneOf:
                - $ref: "#/components/schemas/AgentBookHuman"
                - type: "null"
    SiwaActivityDay:
      type: object
      additionalProperties: false
      required: [audience, day, accepted, leases, first_seen_at, last_seen_at]
      properties:
        audience:
          type: string
          minLength: 1
        day:
          type: string
          format: date
          description: The UTC day.
        accepted:
          type: integer
          minimum: 1
          description: How many requests were verified for the wallet at this site on this day.
        leases:
          type: integer
          minimum: 0
          description: How many of those requests began a lease.
        first_seen_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ServiceError"
      additionalProperties: true
