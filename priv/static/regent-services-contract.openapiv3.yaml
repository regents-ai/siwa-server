openapi: 3.1.0
info:
  title: Regent Shared Services Contract
  version: 0.2.0
  description: >
    Source-of-truth contract for shared Regent HTTP services. Shared SIWA routes
    own signed identity proof, agent registration on Base, request verification,
    health and contract discovery.
x-regent-capability:
  status: beta
  owner: shared-services
  money_path: true
  cli_surface: true
  mobile_surface: false
x-regent-rate-limits:
  retry_after_header: Retry-After
  tiers:
    public_unauthenticated: strict bootstrap limits before SIWA identity is proven
    verified_cli_signed_agent: higher allowance after SIWA receipt or HTTP signature verification
  cli_allowance_requires_verified_siwa: true
tags:
  - name: auth
  - name: internal
  - name: control
    description: The control API, which Regent sites call from their server for their signed-in person, to manage that person's customer, sites and site keys.
paths:
  /:
    get:
      operationId: siwaServerRoot
      tags: [auth]
      responses:
        "200":
          description: Plain text naming the agent guide at /skill.md
          content:
            text/plain:
              schema:
                type: string
  /healthz:
    get:
      operationId: siwaServerHealthz
      tags: [auth]
      responses:
        "200":
          description: Simple health check response for the shared SIWA server
          content:
            text/plain:
              schema:
                type: string
  /readyz:
    get:
      operationId: siwaServerReadyz
      tags: [auth]
      responses:
        "200":
          description: Readiness checks passed for the shared SIWA server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: One or more readiness checks failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
  /regent-services-contract.openapiv3.yaml:
    get:
      operationId: regentServicesContractSource
      tags: [auth]
      responses:
        "200":
          description: Source-of-truth contract served by the shared SIWA server
          content:
            application/yaml:
              schema:
                type: string
  /api/shared/siwa/audiences:
    get:
      operationId: listSharedWalletSiwaAudiences
      tags: [auth]
      description: List the sites an agent can sign in to with its own key, one row for each origin that signs in for an audience. An audience can have several origins. An agent matches the site it is calling to an origin here to learn which audience to sign in for.
      responses:
        "200":
          description: Audiences open to wallet sign-in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletSiwaAudiencesResponse"
  /api/shared/siwa/wallet/nonce:
    post:
      operationId: createSharedWalletSiwaNonce
      tags: [auth]
      description: Issue a single-use ERC-4361 wallet challenge for an enabled audience. Ordinary wallets, and smart wallets on Ethereum or Base, can sign it. No private key is accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletSiwaNonceRequest"
      responses:
        "200":
          description: Issue a single-use ERC-4361 wallet challenge for an enabled audience
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletSiwaNonceResponse"
        "400":
          description: Malformed wallet request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Invalid signature, canonical message or expired challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Wallet audience is not enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Challenge absent or already consumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: Request body too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "415":
          description: Unsupported content type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Wallet verification unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimitError"
  /api/shared/siwa/wallet/verify:
    post:
      operationId: verifySharedWalletSiwaSession
      tags: [auth]
      description: Verify wallet control without asserting human identity or agent registration. A smart wallet's signature is checked on the chain it signs in on with ERC-1271, wrapped with ERC-6492 before the wallet is deployed. The answer says which method proved the wallet. No private key is accepted.
      parameters:
        - in: header
          name: x-agent-signer
          required: false
          schema:
            type: string
          description: How the agent signs, used only to word the hint on a refusal. `own-key` when the agent client keeps the key, or the name of the agent's own signer command, such as `cast`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletSiwaVerifyRequest"
      responses:
        "200":
          description: Verify wallet control without asserting human identity or agent registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletSiwaVerifyResponse"
        "400":
          description: Malformed wallet request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Invalid signature, canonical message or expired challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Wallet audience is not enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Challenge absent or already consumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: Request body too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "415":
          description: Unsupported content type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Wallet verification unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Smart wallet signature lookup on the chain it signed in on failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimitError"
  /api/shared/siwa/http-verify:
    post:
      operationId: verifySharedSiwaHttpEnvelope
      tags: [auth]
      description: >-
        A customer's site asks with its server key as the bearer. The key names
        the site, and the site's audience is the one the receipt must match. An
        unknown, revoked or archived key is refused before the agent's request
        is looked at. A production site's request is used up and its agent
        counted once in the customer's current billing period in one step; a
        request refused for billing or the cap is not used up, so the agent may
        send it again. A Regent site named in SIWA_WALLET_ORIGINS may still ask
        with only x-siwa-audience; a customer's site may not.
      security:
        - SiteServerKey: []
        - {}
      parameters:
        - in: header
          name: x-siwa-audience
          required: false
          schema:
            type: string
          description: >-
            The audience the SIWA receipt must match. Required without a server
            key. With one it may be left out; when sent it must be the key's
            site's audience.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiwaHttpVerifyRequest"
      responses:
        "200":
          description: Protected request envelope verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletSiwaHttpVerifyResponse"
        "400":
          description: Invalid envelope request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: >-
            Envelope verification failed; or the server key is unknown, revoked
            or its site archived (site_key_invalid); or x-siwa-audience is not
            the key's site's audience (site_audience_mismatch); or a customer's
            site's audience was sent without its key (site_key_required)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "402":
          description: >-
            The production site's customer has no billing period running now
            (billing_required), or its period's cap has no room for another new
            agent (agent_cap_reached). The request is not used up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The key's site is a production site whose origins are not proven (site_not_verified)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Request replay detected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: SIWA protected request envelope is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "415":
          description: SIWA protected request content type is unsupported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: SIWA HTTP verification is not configured, or the verified request could not be recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Smart wallet signature lookup on Base failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimitError"
  /api/shared/siwa/activity:
    post:
      operationId: readSharedSiwaActivity
      summary: Read how much one wallet's agent was verified at each Regents site each day
      description: >-
        Returns one line for each site and UTC day on which
        /api/shared/siwa/http-verify verified a request for the wallet over the
        last 30 days, newest day first. Each line names the audience, the day,
        how many requests were verified, how many of them began a lease, and when
        the first and the last of them was verified. Reads a site checks itself
        on a lease never reach this server and are not counted. The lines say what arrived for the wallet at a site.
        Methods, paths, request bodies, headers, receipts and signatures are
        never kept. agentRegistration is the agent registry listing the wallet
        registered through this server or linked last, while the registry still
        names the wallet, or null, the same as http-verify returns. agentBook is
        the World ID-verified person the wallet accepted, for good, or null, the
        same as http-verify returns.
      tags: [internal]
      security:
        - ActivityReadToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiwaActivityRequest"
      responses:
        "200":
          description: The wallet's recent verified requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiwaActivityResponse"
        "400":
          description: Invalid activity request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: The activity read token was absent or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: Activity request is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "415":
          description: Activity request content type is unsupported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimitError"
  /api/shared/siwa/hosted:
    post:
      operationId: siwaHostedAgentRequest
      tags: [internal]
      description: >
        Register the persistent signer for one of the calling site's account
        connections, or sign one of that site's own identity or pairing requests
        for it (Patchbay's ChatGPT app may also send its two MCP tools).
        The site asks with its own hosted signing key, which works only here;
        everything signed is bound to that site's audience, and a connection key
        reaches only the signer the same site registered. Does not expose keys or
        sign payments, transactions or arbitrary messages.
      security:
        - HostedSigningKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operation, identity_key]
              additionalProperties: false
              properties:
                operation:
                  type: string
                  enum: [register, sign]
                identity_key:
                  type: string
                  pattern: '^[a-f0-9]{64}$'
                  description: Site-derived stable account connection key; never a chat identifier.
                request:
                  type: object
                  required: [method, path, authority]
                  additionalProperties: false
                  properties:
                    method:
                      type: string
                      enum: [GET, POST]
                    authority:
                      type: string
                      description: The calling site's own host the request is sent to, one of its sign-in origins' hosts.
                    path:
                      type: string
                      enum: [/api/agents/v1/whoami, /api/agents/v1/me, /api/agents/v1/pair, /chatgpt/agent/mcp]
                    body:
                      type: string
                      maxLength: 32768
                      description: Exact request bytes. MCP bodies permit ask_question and post_reply only, and only for Patchbay.
      responses:
        "200":
          description: Public signer address, or a signed envelope for the calling site only.
          content:
            application/json:
              schema:
                type: object
        "400":
          description: The body is not JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: No site's hosted signing key was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: Request exceeds the bounded body size.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "415":
          description: Unsupported content type.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Unsupported operation, unknown connection or signing refused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimitError"
        "503":
          description: The connection's stored key does not open with this server's key store password (hosted_key_unreadable).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/shared/siwa/agent/register-step:
    post:
      operationId: buildAgentRegistrationStep
      summary: Build the transaction that lists an agent in the Base agent registry
      description: >-
        Optional; sign-in never needs it. Returns the unsigned transaction a
        wallet sends to list itself in the Base ERC-8004 agent registry
        0x8004a169fb4a3325136eb29fa0ceb6d2e539a432: register(agentUri), where
        agentUri is the agent's public profile on this server. The URI names a
        digest of the wallet, name, description and image, so sending the
        transaction is consent to exactly that profile. The wallet pays the gas;
        this server never sends or funds a transaction. Nothing is stored.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentRegisterStepRequest"
      responses:
        "200":
          description: The registration transaction for the wallet to send
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRegisterStepResponse"
        "400":
          description: Invalid registration request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: Registration request body is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "415":
          description: Registration request content type is unsupported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimitError"
  /api/shared/siwa/agent/registered:
    post:
      operationId: readAgentRegistration
      summary: Read what a sent registration did on Base
      description: >-
        Reads the transaction at the latest Base block. It must be the wallet's
        registration exactly as register-step built it for the same name,
        description and image. Until its receipt exists the answer is
        registration_pending; ask again after a couple of seconds. Once it lands
        the registration is kept: the profile is served at its agentUri, and
        /api/shared/siwa/http-verify names it in agentRegistration for the
        wallet's signed requests.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentRegisteredRequest"
      responses:
        "200":
          description: The registration is still pending, or the agent is registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRegisteredResponse"
        "400":
          description: Invalid registration request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: Registration request body is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "415":
          description: Registration request content type is unsupported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: The transaction reverted, or is not this wallet's registration of this profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimitError"
        "502":
          description: Base could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/shared/siwa/agent/link-challenge:
    post:
      operationId: createAgentLinkChallenge
      summary: Start linking a listing made with another tool in the Base agent registry
      description: >-
        For an agent listed in the Base agent registry by any tool. Reads the
        registry at the latest Base block: it must name the wallet as the
        agent's owner (ownerOf) or its agent wallet (getAgentWallet). Answers a
        single-use message naming the wallet and the agent, valid for the
        sign-in challenge lifetime, for the wallet to sign unchanged and send
        to /api/shared/siwa/agent/link.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentLinkChallengeRequest"
      responses:
        "200":
          description: The message to sign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentLinkChallengeResponse"
        "400":
          description: Invalid link request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: Link request body is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "415":
          description: Link request content type is unsupported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: The registry names neither this wallet as the agent's owner nor as its agent wallet, or the agent does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimitError"
        "502":
          description: Base could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/shared/siwa/agent/link:
    post:
      operationId: linkAgentListing
      summary: Link a listing made with another tool in the Base agent registry
      description: >-
        Keeps the link once the wallet has signed the unused message from
        /api/shared/siwa/agent/link-challenge for the same agent and the
        registry, read again at the latest Base block, still names the wallet
        as the agent's owner or agent wallet. The signature is the wallet's
        consent: anyone can send a listing to any wallet, but only the wallet
        can link it. /api/shared/siwa/http-verify then names the listing in
        agentRegistration for the wallet's signed requests, until the wallet
        registers or links another.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentLinkRequest"
      responses:
        "200":
          description: The listing is linked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentLinkedResponse"
        "400":
          description: Invalid link request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: The challenge expired, the message is not the one issued for this agent, or the signature does not match the wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: The challenge is absent, expired or already used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: Link request body is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "415":
          description: Link request content type is unsupported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: The registry no longer names this wallet as the agent's owner or agent wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimitError"
        "502":
          description: Base, or the wallet's chain for a smart wallet's signature, could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/shared/siwa/agent-book/challenge:
    post:
      operationId: createAgentBookChallenge
      tags: [auth]
      description: "Read the person World's AgentBook names behind the wallet now and issue a single-use message, valid for five minutes, for the wallet to sign to accept that person. A wallet accepts once: sites show the accepted person for good, whatever AgentBook names later."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentBookChallengeRequest"
      responses:
        "200":
          description: The person AgentBook names now and the message to sign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentBookChallengeResponse"
        "400":
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: World's AgentBook names no person behind this wallet (not_in_agent_book)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: The wallet has already accepted its person, for good (agent_book_already_accepted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: Request body too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "415":
          description: Unsupported content type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: World's AgentBook could not be read (agent_book_unavailable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimitError"
  /api/shared/siwa/agent-book/accept:
    post:
      operationId: acceptAgentBookHuman
      tags: [auth]
      description: Accept the person named in a challenge from /api/shared/siwa/agent-book/challenge. The wallet signs the exact message; ordinary wallets, and smart wallets on Ethereum or Base, can sign it. The person is kept, for good, only when World's AgentBook still names them and the wallet has not accepted a person before. No private key is accepted.
      parameters:
        - in: header
          name: x-agent-signer
          required: false
          schema:
            type: string
          description: How the agent signs, used only to word the hint on a refusal. `own-key` when the agent client keeps the key, or the name of the agent's own signer command, such as `cast`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentBookAcceptRequest"
      responses:
        "200":
          description: The wallet accepted the person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentBookAcceptResponse"
        "400":
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Invalid signature, changed message or expired challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Challenge absent or already used, or AgentBook names no person behind the wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: AgentBook names a different person than the challenge did (agent_book_changed), or the wallet has already accepted its person (agent_book_already_accepted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: Request body too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "415":
          description: Unsupported content type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: World's AgentBook, or a smart wallet's signature on the chain it signed on, could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimitError"
  /agent-profiles/{profile_id}:
    get:
      operationId: readAgentProfile
      summary: The registration file of an agent listed through this server
      description: >-
        The ERC-8004 registration file an agent's registry entry points to.
        Served once a registration of it has landed; anyone may read it.
      tags: [auth]
      parameters:
        - in: path
          name: profile_id
          required: true
          schema:
            type: string
            pattern: "^[0-9a-f]{32}$"
      responses:
        "200":
          description: The agent's registration file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentProfile"
        "404":
          description: No registered agent has this profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimitError"
  /api/control/v1/session:
    post:
      operationId: createControlSession
      summary: Trade a person's Privy sign-in for a control token
      description: >-
        A Regent site's server sends its signed-in person's Privy access token
        as the bearer and their identity token in privy-id-token. Both must be
        current, for this server's Privy app, and from the same sign-in. The
        answer is a control token naming only the person's Privy DID, good for
        15 minutes. Limited to 600 a minute per calling computer.
      tags: [control]
      security:
        - PrivyAccessToken: []
          PrivyIdentityToken: []
      responses:
        "200":
          description: The control token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlSessionResponse"
        "401":
          description: The Privy tokens are missing, expired, for another app, from two sign-ins, or not signed by Privy (privy_proof_invalid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimitError"
        "503":
          $ref: "#/components/responses/ControlNotConfigured"
  /api/control/v1/account:
    get:
      operationId: readControlAccount
      summary: The person's DID, their customer or null, and its usage this billing period or null
      tags: [control]
      security:
        - ControlToken: []
      responses:
        "200":
          description: The person's account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlAccountResponse"
        "401":
          $ref: "#/components/responses/ControlTokenInvalid"
        "503":
          $ref: "#/components/responses/ControlNotConfigured"
  /api/control/v1/customer:
    post:
      operationId: createControlCustomer
      summary: Make the person's customer
      description: A person has at most one customer. It is made paid.
      tags: [control]
      security:
        - ControlToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerRequest"
      responses:
        "201":
          description: The customer made (customer_created)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
        "400":
          $ref: "#/components/responses/ControlRequestInvalid"
        "401":
          $ref: "#/components/responses/ControlTokenInvalid"
        "409":
          description: The person already has a customer (customer_exists)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          $ref: "#/components/responses/ControlBodyTooLarge"
        "415":
          $ref: "#/components/responses/ControlUnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ControlFieldsInvalid"
        "503":
          $ref: "#/components/responses/ControlNotConfigured"
    patch:
      operationId: updateControlCustomer
      summary: Rename the person's customer
      tags: [control]
      security:
        - ControlToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerRequest"
      responses:
        "200":
          description: The renamed customer (customer_updated)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
        "400":
          $ref: "#/components/responses/ControlRequestInvalid"
        "401":
          $ref: "#/components/responses/ControlTokenInvalid"
        "404":
          $ref: "#/components/responses/ControlNotFound"
        "413":
          $ref: "#/components/responses/ControlBodyTooLarge"
        "415":
          $ref: "#/components/responses/ControlUnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ControlFieldsInvalid"
        "503":
          $ref: "#/components/responses/ControlNotConfigured"
  /api/control/v1/cap:
    put:
      operationId: setControlCap
      summary: Set the customer's cap, or remove it with null
      description: >-
        The cap is the most the customer pays in one billing period, in cents.
        It is set on the customer and on its current billing period together.
        It is at least 9900 (the fee for the 1000 included agents) and never
        below the fee the current period has already reached. While a period
        has a cap, it counts no more new agents than the cap pays for; agents
        already counted keep signing in.
      tags: [control]
      security:
        - ControlToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CapRequest"
      responses:
        "200":
          description: The customer and its usage with the new cap (cap_updated)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapResponse"
        "400":
          $ref: "#/components/responses/ControlRequestInvalid"
        "401":
          $ref: "#/components/responses/ControlTokenInvalid"
        "404":
          $ref: "#/components/responses/ControlNotFound"
        "413":
          $ref: "#/components/responses/ControlBodyTooLarge"
        "415":
          $ref: "#/components/responses/ControlUnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ControlFieldsInvalid"
        "503":
          $ref: "#/components/responses/ControlNotConfigured"
  /api/control/v1/agents:
    get:
      operationId: listControlAgents
      summary: The agents counted in the customer's current billing period, newest first
      description: >-
        Each agent once, with the first time it was counted this period and the
        site that counted it. Empty when no period is running.
      tags: [control]
      security:
        - ControlToken: []
      parameters:
        - in: query
          name: after
          required: false
          schema:
            type: string
          description: The next cursor a previous page gave.
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: A page of agents (agents)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentsResponse"
        "400":
          description: The query has a parameter this route does not take (control_request_invalid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/ControlTokenInvalid"
        "404":
          $ref: "#/components/responses/ControlNotFound"
        "422":
          $ref: "#/components/responses/ControlFieldsInvalid"
        "503":
          $ref: "#/components/responses/ControlNotConfigured"
  /api/control/v1/sites:
    get:
      operationId: listControlSites
      summary: The customer's sites that are not archived, oldest first
      tags: [control]
      security:
        - ControlToken: []
      responses:
        "200":
          description: The sites (sites)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SitesResponse"
        "401":
          $ref: "#/components/responses/ControlTokenInvalid"
        "404":
          $ref: "#/components/responses/ControlNotFound"
        "503":
          $ref: "#/components/responses/ControlNotConfigured"
    post:
      operationId: createControlSite
      summary: Add a site to the customer
      description: >-
        The audience is taken for good: no other site, archived ones included,
        may use it, and none named in SIWA_WALLET_ORIGINS may be taken. A
        sandbox site lists only http://localhost:<port> origins and needs no
        proof. A production site lists only https:// origins with a lowercase
        host and nothing after it, and starts with originProof unverified.
      tags: [control]
      security:
        - ControlToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteCreateRequest"
      responses:
        "201":
          description: The site made (site_created)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteResponse"
        "400":
          $ref: "#/components/responses/ControlRequestInvalid"
        "401":
          $ref: "#/components/responses/ControlTokenInvalid"
        "404":
          $ref: "#/components/responses/ControlNotFound"
        "413":
          $ref: "#/components/responses/ControlBodyTooLarge"
        "415":
          $ref: "#/components/responses/ControlUnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ControlFieldsInvalid"
        "503":
          $ref: "#/components/responses/ControlNotConfigured"
  /api/control/v1/sites/{id}:
    parameters:
      - $ref: "#/components/parameters/SiteId"
    get:
      operationId: readControlSite
      summary: One of the customer's sites that is not archived
      tags: [control]
      security:
        - ControlToken: []
      responses:
        "200":
          description: The site (site)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteResponse"
        "401":
          $ref: "#/components/responses/ControlTokenInvalid"
        "404":
          $ref: "#/components/responses/ControlNotFound"
        "503":
          $ref: "#/components/responses/ControlNotConfigured"
    patch:
      operationId: updateControlSite
      summary: Rename a site or change its origins
      description: >-
        The audience and environment never change. Changing a production site's
        origins makes its originProof unverified again.
      tags: [control]
      security:
        - ControlToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteUpdateRequest"
      responses:
        "200":
          description: The changed site (site_updated)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteResponse"
        "400":
          $ref: "#/components/responses/ControlRequestInvalid"
        "401":
          $ref: "#/components/responses/ControlTokenInvalid"
        "404":
          $ref: "#/components/responses/ControlNotFound"
        "413":
          $ref: "#/components/responses/ControlBodyTooLarge"
        "415":
          $ref: "#/components/responses/ControlUnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ControlFieldsInvalid"
        "503":
          $ref: "#/components/responses/ControlNotConfigured"
    delete:
      operationId: archiveControlSite
      summary: Archive a site
      description: >-
        The site is kept with its audience, which stays taken, and is no longer
        listed or found; its keys stop working.
      tags: [control]
      security:
        - ControlToken: []
      responses:
        "200":
          description: The archived site (site_archived)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteResponse"
        "401":
          $ref: "#/components/responses/ControlTokenInvalid"
        "404":
          $ref: "#/components/responses/ControlNotFound"
        "503":
          $ref: "#/components/responses/ControlNotConfigured"
  /api/control/v1/sites/{id}/keys:
    parameters:
      - $ref: "#/components/parameters/SiteId"
    get:
      operationId: listControlSiteKeys
      summary: A site's server keys, revoked ones included, newest first
      description: Never the key itself.
      tags: [control]
      security:
        - ControlToken: []
      responses:
        "200":
          description: The site's keys (site_keys)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteKeysResponse"
        "401":
          $ref: "#/components/responses/ControlTokenInvalid"
        "404":
          $ref: "#/components/responses/ControlNotFound"
        "503":
          $ref: "#/components/responses/ControlNotConfigured"
    post:
      operationId: createControlSiteKey
      summary: Make a server key for a site
      description: >-
        The only answer that ever holds the key: it is not kept and cannot be
        shown again. A site has at most 5 keys that are not revoked.
      tags: [control]
      security:
        - ControlToken: []
      responses:
        "201":
          description: The key made, with the key itself (site_key_created)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteKeyCreatedResponse"
        "401":
          $ref: "#/components/responses/ControlTokenInvalid"
        "404":
          $ref: "#/components/responses/ControlNotFound"
        "409":
          description: The site already has 5 keys that are not revoked (site_key_limit)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          $ref: "#/components/responses/ControlNotConfigured"
  /api/control/v1/sites/{id}/keys/{key_id}:
    parameters:
      - $ref: "#/components/parameters/SiteId"
      - in: path
        name: key_id
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: revokeControlSiteKey
      summary: Revoke a site's server key
      description: The key is kept, revoked. Revoking it again changes nothing.
      tags: [control]
      security:
        - ControlToken: []
      responses:
        "200":
          description: The revoked key (site_key_revoked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteKeyResponse"
        "401":
          $ref: "#/components/responses/ControlTokenInvalid"
        "404":
          $ref: "#/components/responses/ControlNotFound"
        "503":
          $ref: "#/components/responses/ControlNotConfigured"
components:
  securitySchemes:
    ActivityReadToken:
      type: http
      scheme: bearer
      description: Shared token, held only by Regents sites, that permits reading verified-request activity.
    HostedSigningKey:
      type: http
      scheme: bearer
      description: A site's own key for hosted signing, one per site (SIWA_HOSTED_SIGNERS); it opens no other route.
    SiteServerKey:
      type: http
      scheme: bearer
      description: A customer's site's server key (siwa_sk_test_ or siwa_sk_live_), made with POST /api/control/v1/sites/{id}/keys. It names the site.
    PrivyAccessToken:
      type: http
      scheme: bearer
      description: The signed-in person's Privy access token, for this server's Privy app (PRIVY_APP_ID).
    PrivyIdentityToken:
      type: apiKey
      in: header
      name: privy-id-token
      description: The same person's Privy identity token, from the same sign-in as the access token.
    ControlToken:
      type: http
      scheme: bearer
      description: A control token from POST /api/control/v1/session. It names one person and lasts 15 minutes.
  parameters:
    SiteId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
  responses:
    RateLimitError:
      description: Too many requests
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ControlNotConfigured:
      description: The control API is off on this server until its Privy settings are set (control_not_configured)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ControlTokenInvalid:
      description: The control token is missing, not valid or older than 15 minutes (control_token_invalid)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ControlRequestInvalid:
      description: The body is not JSON (bad_request), or holds a field this route does not take (control_request_invalid)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ControlNotFound:
      description: >-
        The person has no customer yet (customer_not_found), or their customer
        has no site that is not archived with that id (site_not_found), or that
        site has no key with that id (site_key_not_found). Another person's
        records answer the same.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ControlFieldsInvalid:
      description: Some fields broke their rules (control_fields_invalid); fields names each one and why
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ControlFieldsErrorEnvelope"
    ControlBodyTooLarge:
      description: The body is larger than 64 KiB (request_body_too_large)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ControlUnsupportedMediaType:
      description: The body is not application/json (unsupported_media_type)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    Address:
      type: string
      pattern: "^0x[a-fA-F0-9]{40}$"
    BaseChainId:
      type: integer
      enum: [8453]
    WalletChainId:
      type: integer
      enum: [1, 8453]
      description: The chain the wallet signs in on, Ethereum (1) or Base (8453). An ordinary wallet's signature holds on every chain; a smart wallet's is checked on this chain.
    VerificationMethod:
      type: string
      enum: [eoa_recovery, erc1271, erc6492]
      description: How the wallet's signature was proven. eoa_recovery holds on every chain; erc1271 and erc6492 hold on the chain named by chainId only.
    HexData:
      type: string
      pattern: "^0x[a-fA-F0-9]*$"
    WalletSiwaNonceRequest:
      type: object
      required: [wallet_address, chain_id, audience]
      properties:
        wallet_address:
          $ref: "#/components/schemas/Address"
        chain_id:
          $ref: "#/components/schemas/WalletChainId"
        audience:
          type: string
          minLength: 1
          maxLength: 200
      additionalProperties: false
    WalletSiwaVerifyRequest:
      type: object
      required: [wallet_address, chain_id, audience, nonce, message, signature]
      properties:
        wallet_address:
          $ref: "#/components/schemas/Address"
        chain_id:
          $ref: "#/components/schemas/WalletChainId"
        audience:
          type: string
          minLength: 1
          maxLength: 200
        nonce:
          type: string
          pattern: '^[a-f0-9]{32}$'
        message:
          type: string
          maxLength: 2048
          description: Exact server-issued ERC-4361 message; do not reconstruct it from caller fields.
        signature:
          type: string
          pattern: '^0x([a-fA-F0-9]{2})+$'
          maxLength: 8194
          description: ERC-191 personal signature from the wallet, or a smart wallet's ERC-1271 signature (ERC-6492-wrapped before deployment); never a private key.
      additionalProperties: false
    WalletSiwaAudiencesResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: string
          enum: [audiences]
        data:
          type: object
          required: [audiences]
          properties:
            audiences:
              type: array
              items:
                type: object
                required: [audience, origin]
                properties:
                  audience:
                    type: string
                  origin:
                    type: string
                    format: uri
                additionalProperties: false
          additionalProperties: false
      additionalProperties: false
    WalletSiwaNonceResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: string
          enum: [nonce_issued]
        data:
          type: object
          required: [walletAddress, chainId, audience, nonce, message, issuedAt, expiresAt]
          properties:
            walletAddress:
              $ref: "#/components/schemas/Address"
            chainId:
              $ref: "#/components/schemas/WalletChainId"
            audience:
              type: string
            nonce:
              type: string
            message:
              type: string
              description: Canonical server-issued ERC-4361 message to review and sign.
            issuedAt:
              type: string
              format: date-time
            expiresAt:
              type: string
              format: date-time
          additionalProperties: false
      additionalProperties: false
    WalletSiwaVerifyResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: string
          enum: [wallet_verified]
        data:
          type: object
          required: [verified, walletAddress, chainId, audience, keyId, signatureScheme, verificationMethod, proof, receipt, receiptExpiresAt]
          properties:
            verified:
              type: boolean
              enum: [true]
            walletAddress:
              $ref: "#/components/schemas/Address"
            chainId:
              $ref: "#/components/schemas/WalletChainId"
            audience:
              type: string
            keyId:
              type: string
            signatureScheme:
              type: string
              enum: [evm_personal_sign]
            verificationMethod:
              $ref: "#/components/schemas/VerificationMethod"
            proof:
              type: string
              enum: [wallet_signature]
            receipt:
              type: string
              description: Short-lived siwa_wallet_receipt bound to address, chain and audience. It proves neither registry ownership nor human Privy identity.
            receiptExpiresAt:
              type: string
              format: date-time
          additionalProperties: false
      additionalProperties: false
    WalletPrincipal:
      type: object
      required: [kind, wallet_address, chain_id, audience]
      properties:
        kind:
          type: string
          enum: [wallet]
        wallet_address:
          $ref: "#/components/schemas/Address"
        chain_id:
          $ref: "#/components/schemas/WalletChainId"
        audience:
          type: string
      additionalProperties: false
    WalletSiwaHttpVerifyResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: string
          enum: [http_envelope_valid]
        data:
          type: object
          required: [verified, walletAddress, chainId, keyId, verificationMethod, principal, receiptExpiresAt, requiredHeaders, requiredCoveredComponents, coveredComponents, agentRegistration, agentBook]
          properties:
            verified:
              type: boolean
              enum: [true]
            walletAddress:
              $ref: "#/components/schemas/Address"
            chainId:
              $ref: "#/components/schemas/WalletChainId"
            keyId:
              type: string
            verificationMethod:
              $ref: "#/components/schemas/VerificationMethod"
            principal:
              $ref: "#/components/schemas/WalletPrincipal"
            agentRegistration:
              description: The Base agent registry listing the wallet registered through this server or linked last, while the registry still names the wallet, or null.
              oneOf:
                - $ref: "#/components/schemas/AgentRegistration"
                - type: "null"
            agentBook:
              description: The World ID-verified person this wallet accepted, for good; otherwise null. Each site decides when to show humanId.
              oneOf:
                - $ref: "#/components/schemas/AgentBookHuman"
                - type: "null"
            receiptExpiresAt:
              type: string
              format: date-time
            requiredHeaders:
              type: array
              items:
                type: string
            requiredCoveredComponents:
              type: array
              items:
                type: string
            coveredComponents:
              type: array
              items:
                type: string
            leaseExpiresAt:
              description: Sent only when the site asked for a lease and the wallet signed with its own key. Until then the site checks this agent's read-only requests under the same receipt itself. Never after receiptExpiresAt, nor after the end of the billing period a production site's agent was counted in.
              type: string
              format: date-time
            subject:
              description: Sent only to a site that asked with its server key. The agent, as eip155:<chain id>:<lowercase address>.
              type: string
              pattern: "^eip155:[1-9][0-9]*:0x[0-9a-f]{40}$"
            usage:
              description: Sent only to a production site that asked with its server key.
              type: object
              additionalProperties: false
              required: [activeThisPeriod, newThisPeriod]
              properties:
                activeThisPeriod:
                  type: boolean
                  enum: [true]
                newThisPeriod:
                  description: True when this request counted the agent for the first time in the customer's current billing period.
                  type: boolean
          additionalProperties: false
      additionalProperties: false
    SiwaHttpVerifyRequest:
      type: object
      required: [method, path, authority, headers]
      properties:
        method:
          type: string
        path:
          type: string
        authority:
          description: The host the site received the request at, lowercase, with :port only when it is not the scheme's default. It must be a host of one of the audience's sign-in origins.
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
        body_digest:
          description: The content-digest of the body the site read (sha-256=:<base64>:), sent only when the request had a body. The body itself is never sent.
          type: string
        lease:
          description: True only on a request that changes nothing and spends nothing. Asks for a lease, answered with leaseExpiresAt when the wallet signed with its own key.
          type: boolean
      additionalProperties: false
    AgentProfileFields:
      type: object
      required: [name, description]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          minLength: 1
          maxLength: 1000
        image:
          type: string
          maxLength: 500
          pattern: "^https://\\S+$"
    AgentRegisterStepRequest:
      allOf:
        - $ref: "#/components/schemas/AgentProfileFields"
        - type: object
          required: [wallet_address]
          properties:
            wallet_address:
              $ref: "#/components/schemas/Address"
      unevaluatedProperties: false
    AgentRegisterStepResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: string
          enum: [registration_step]
        data:
          type: object
          required: [chainId, from, to, data, value, agentUri]
          properties:
            chainId:
              $ref: "#/components/schemas/BaseChainId"
            from:
              $ref: "#/components/schemas/Address"
            to:
              $ref: "#/components/schemas/Address"
            data:
              $ref: "#/components/schemas/HexData"
            value:
              $ref: "#/components/schemas/HexData"
            agentUri:
              type: string
              format: uri
          additionalProperties: false
      additionalProperties: false
    AgentRegisteredRequest:
      allOf:
        - $ref: "#/components/schemas/AgentProfileFields"
        - type: object
          required: [wallet_address, tx_hash]
          properties:
            wallet_address:
              $ref: "#/components/schemas/Address"
            tx_hash:
              type: string
              pattern: "^0x[a-fA-F0-9]{64}$"
      unevaluatedProperties: false
    AgentLinkChallengeRequest:
      type: object
      required: [wallet_address, chain_id, token_id]
      properties:
        wallet_address:
          $ref: "#/components/schemas/Address"
        chain_id:
          $ref: "#/components/schemas/WalletChainId"
        token_id:
          $ref: "#/components/schemas/AgentTokenId"
      additionalProperties: false
    AgentLinkChallengeResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: string
          enum: [agent_link_challenge]
        data:
          type: object
          required: [walletAddress, chainId, tokenId, nonce, message, issuedAt, expiresAt]
          properties:
            walletAddress:
              $ref: "#/components/schemas/Address"
            chainId:
              $ref: "#/components/schemas/WalletChainId"
            tokenId:
              $ref: "#/components/schemas/AgentTokenId"
            nonce:
              type: string
            message:
              type: string
              description: Server-issued message naming the wallet and the agent, to review and sign unchanged.
            issuedAt:
              type: string
              format: date-time
            expiresAt:
              type: string
              format: date-time
          additionalProperties: false
      additionalProperties: false
    AgentLinkRequest:
      type: object
      required: [wallet_address, chain_id, token_id, nonce, message, signature]
      properties:
        wallet_address:
          $ref: "#/components/schemas/Address"
        chain_id:
          $ref: "#/components/schemas/WalletChainId"
        token_id:
          $ref: "#/components/schemas/AgentTokenId"
        nonce:
          type: string
          pattern: '^[a-f0-9]{32}$'
        message:
          type: string
          maxLength: 2048
          description: Exact server-issued challenge message.
        signature:
          type: string
          pattern: '^0x([a-fA-F0-9]{2})+$'
          maxLength: 8194
          description: ERC-191 personal signature from the wallet, or a smart wallet's ERC-1271 signature (ERC-6492-wrapped before deployment); never a private key.
      additionalProperties: false
    AgentLinkedResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: string
          enum: [agent_linked]
        data:
          allOf:
            - $ref: "#/components/schemas/AgentRegistration"
            - type: object
              required: [walletAddress, chainId, registryAddress]
              properties:
                walletAddress:
                  $ref: "#/components/schemas/Address"
                chainId:
                  $ref: "#/components/schemas/BaseChainId"
                registryAddress:
                  $ref: "#/components/schemas/Address"
          unevaluatedProperties: false
      additionalProperties: false
    AgentTokenId:
      type: string
      pattern: "^(0|[1-9][0-9]{0,76})$"
      description: The agent's token id in the Base agent registry, in decimal.
    AgentRegistration:
      type: object
      description: The wallet's entry in the Base agent registry, the one it registered through this server or linked last. Sites link to registryUrl.
      required: [agentId, tokenId, profileUrl, registryUrl]
      properties:
        agentId:
          type: string
          description: eip155:8453:<registry address>:<token id>
        tokenId:
          type: string
        profileUrl:
          description: The listing's own profile address when it is an https:// or ipfs:// address; null when the listing has none or carries its profile inside itself.
          oneOf:
            - type: string
              format: uri
            - type: "null"
        registryUrl:
          type: string
          format: uri
      additionalProperties: false
    AgentBookHuman:
      type: object
      description: A World ID-verified person stands behind this agent wallet in World's AgentBook (World Chain, 0xA23aB2712eA7BBa896930544C7d6636a96b944dA), and the wallet accepted that person, for good, through /api/shared/siwa/agent-book/accept.
      required: [humanId, agentCount]
      properties:
        humanId:
          type: string
          pattern: "^0x[0-9a-f]{64}$"
          description: The person's anonymous World ID number (nullifier hash). The same person's agents share it.
        agentCount:
          type: integer
          minimum: 1
          description: How many agent wallets, this one included, have accepted this same person. Counts only wallets that have signed in through this server.
      additionalProperties: false
    AgentBookChallengeRequest:
      type: object
      required: [wallet_address, chain_id]
      properties:
        wallet_address:
          $ref: "#/components/schemas/Address"
        chain_id:
          $ref: "#/components/schemas/WalletChainId"
      additionalProperties: false
    AgentBookChallengeResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: string
          enum: [agent_book_challenge]
        data:
          type: object
          required: [walletAddress, chainId, humanId, nonce, message, issuedAt, expiresAt]
          properties:
            walletAddress:
              $ref: "#/components/schemas/Address"
            chainId:
              $ref: "#/components/schemas/WalletChainId"
            humanId:
              type: string
              pattern: "^0x[0-9a-f]{64}$"
              description: The person World's AgentBook names behind the wallet now. Check it is your person's number before signing.
            nonce:
              type: string
            message:
              type: string
              description: Server-issued message naming the wallet and the person, to review and sign unchanged.
            issuedAt:
              type: string
              format: date-time
            expiresAt:
              type: string
              format: date-time
          additionalProperties: false
      additionalProperties: false
    AgentBookAcceptRequest:
      type: object
      required: [wallet_address, chain_id, nonce, message, signature]
      properties:
        wallet_address:
          $ref: "#/components/schemas/Address"
        chain_id:
          $ref: "#/components/schemas/WalletChainId"
        nonce:
          type: string
          pattern: '^[a-f0-9]{32}$'
        message:
          type: string
          maxLength: 2048
          description: Exact server-issued challenge message.
        signature:
          type: string
          pattern: '^0x([a-fA-F0-9]{2})+$'
          maxLength: 8194
          description: ERC-191 personal signature from the wallet, or a smart wallet's ERC-1271 signature (ERC-6492-wrapped before deployment); never a private key.
      additionalProperties: false
    AgentBookAcceptResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: string
          enum: [agent_book_accepted]
        data:
          type: object
          required: [walletAddress, humanId]
          properties:
            walletAddress:
              $ref: "#/components/schemas/Address"
            humanId:
              type: string
              pattern: "^0x[0-9a-f]{64}$"
          additionalProperties: false
      additionalProperties: false
    AgentRegisteredResponse:
      oneOf:
        - type: object
          required: [code, data]
          properties:
            code:
              type: string
              enum: [registration_pending]
            data:
              type: object
              required: [txHash]
              properties:
                txHash:
                  type: string
              additionalProperties: false
          additionalProperties: false
        - type: object
          required: [code, data]
          properties:
            code:
              type: string
              enum: [agent_registered]
            data:
              allOf:
                - $ref: "#/components/schemas/AgentRegistration"
                - type: object
                  required: [txHash, walletAddress, chainId, registryAddress]
                  properties:
                    txHash:
                      type: string
                    walletAddress:
                      $ref: "#/components/schemas/Address"
                    chainId:
                      $ref: "#/components/schemas/BaseChainId"
                    registryAddress:
                      $ref: "#/components/schemas/Address"
              unevaluatedProperties: false
          additionalProperties: false
    AgentProfile:
      type: object
      description: ERC-8004 registration file (registration-v1).
      required: [type, name, description, image, services, x402Support, active, registrations]
      properties:
        type:
          type: string
          enum: ["https://eips.ethereum.org/EIPS/eip-8004#registration-v1"]
        name:
          type: string
        description:
          type: string
        image:
          type: string
        services:
          type: array
          items:
            type: object
        x402Support:
          type: boolean
        active:
          type: boolean
        registrations:
          type: array
          items:
            type: object
            required: [agentId, agentRegistry]
            properties:
              agentId:
                type: integer
              agentRegistry:
                type: string
            additionalProperties: false
      additionalProperties: false
    ReadinessResponse:
      type: object
      required: [ready, checks]
      properties:
        ready:
          type: boolean
        checks:
          type: object
          required:
            - database
            - endpoint_secret
            - receipt_secret
            - siwa_ttls
            - keystore_password
            - hosted_keys
            - base_rpc_url
            - base_rpc_chain_id
            - ethereum_rpc_url
            - ethereum_rpc_chain_id
            - world_rpc_url
            - world_rpc_chain_id
          properties:
            database:
              type: boolean
            endpoint_secret:
              type: boolean
            receipt_secret:
              type: boolean
            siwa_ttls:
              type: boolean
            keystore_password:
              type: boolean
            hosted_keys:
              type: boolean
              description: KEYSTORE_PASSWORD opens a stored hosted connection key; true when none is stored.
            base_rpc_url:
              type: boolean
            base_rpc_chain_id:
              type: boolean
            ethereum_rpc_url:
              type: boolean
            ethereum_rpc_chain_id:
              type: boolean
            world_rpc_url:
              type: boolean
            world_rpc_chain_id:
              type: boolean
          additionalProperties: false
      additionalProperties: false
    LooseObject:
      type: object
      additionalProperties: true
    ServiceError:
      type: object
      required: [code, message]
      additionalProperties: true
      properties:
        code:
          type: string
        message:
          type: string
        hint:
          type: string
          description: >-
            What the agent should do next. Every SIWA refusal carries one, shaped by the
            site named in the request and, when signing in, by the agent's advisory
            `x-agent-signer` header.
    SiwaActivityRequest:
      type: object
      additionalProperties: false
      required: [wallet_address, since]
      properties:
        wallet_address:
          $ref: "#/components/schemas/Address"
        since:
          type: string
          format: date-time
          description: Only days whose last verified request was at or after this time are returned.
    SiwaActivityResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [days, agentRegistration, agentBook]
          properties:
            days:
              type: array
              items:
                $ref: "#/components/schemas/SiwaActivityDay"
            agentRegistration:
              description: The Base agent registry listing the wallet registered through this server or linked last, while the registry still names the wallet, or null.
              oneOf:
                - $ref: "#/components/schemas/AgentRegistration"
                - type: "null"
            agentBook:
              description: The World ID-verified person World's AgentBook last named behind the wallet, when the wallet accepted that same person; otherwise null.
              oneOf:
                - $ref: "#/components/schemas/AgentBookHuman"
                - type: "null"
    SiwaActivityDay:
      type: object
      additionalProperties: false
      required: [audience, day, accepted, leases, first_seen_at, last_seen_at]
      properties:
        audience:
          type: string
          minLength: 1
        day:
          type: string
          format: date
          description: The UTC day.
        accepted:
          type: integer
          minimum: 1
          description: How many requests were verified for the wallet at this site on this day.
        leases:
          type: integer
          minimum: 0
          description: How many of those requests began a lease.
        first_seen_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ServiceError"
      additionalProperties: true
    ControlFieldsErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          allOf:
            - $ref: "#/components/schemas/ServiceError"
            - type: object
              required: [fields]
              properties:
                fields:
                  type: object
                  description: Each field that broke its rule, with its reasons.
                  additionalProperties:
                    type: array
                    items:
                      type: string
      additionalProperties: true
    PrivyDid:
      type: string
      description: The person's Privy user id (DID), such as did:privy:cmabc123.
    ControlSessionResponse:
      type: object
      additionalProperties: false
      required: [code, data]
      properties:
        code:
          type: string
          enum: [control_session]
        data:
          type: object
          additionalProperties: false
          required: [token, expiresAt, did]
          properties:
            token:
              type: string
              description: The control token. Send it as the bearer on every other control route until expiresAt.
            expiresAt:
              type: string
              format: date-time
            did:
              $ref: "#/components/schemas/PrivyDid"
    Customer:
      type: object
      additionalProperties: false
      required: [id, name, kind, capCents, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        kind:
          type: string
          enum: [paid, internal]
          description: Every customer made here is paid.
        capCents:
          $ref: "#/components/schemas/CapCents"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CustomerRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
    ControlAccountResponse:
      type: object
      additionalProperties: false
      required: [code, data]
      properties:
        code:
          type: string
          enum: [account]
        data:
          type: object
          additionalProperties: false
          required: [did, customer, usage]
          properties:
            did:
              $ref: "#/components/schemas/PrivyDid"
            customer:
              description: The person's customer, or null before they make one.
              oneOf:
                - $ref: "#/components/schemas/Customer"
                - type: "null"
            usage:
              $ref: "#/components/schemas/Usage"
    CapCents:
      description: The most the customer pays in one billing period, in cents, or null for no cap.
      oneOf:
        - type: integer
          minimum: 9900
          maximum: 2147483647
        - type: "null"
    Usage:
      description: The customer's current billing period, or null when none is running.
      oneOf:
        - type: object
          additionalProperties: false
          required:
            [periodStartsAt, periodEndsAt, activeAgents, includedAgents, feeCents, capCents, maxAgents]
          properties:
            periodStartsAt:
              type: string
              format: date-time
            periodEndsAt:
              description: The period's end, which is not in it.
              type: string
              format: date-time
            activeAgents:
              description: Agents counted this period, each once.
              type: integer
              minimum: 0
            includedAgents:
              description: Agents the base fee covers.
              type: integer
              enum: [1000]
            feeCents:
              description: >-
                The fee this period so far, in cents with one decimal place, as a
                string so it stays exact: 99 dollars for up to 1000 agents, then
                9.9 cents for each agent after.
              type: string
              pattern: "^[0-9]+\\.[0-9]$"
            capCents:
              $ref: "#/components/schemas/CapCents"
            maxAgents:
              description: The most agents the period's cap pays for, or null with no cap.
              oneOf:
                - type: integer
                  minimum: 1000
                - type: "null"
        - type: "null"
    CapRequest:
      type: object
      additionalProperties: false
      required: [capCents]
      properties:
        capCents:
          $ref: "#/components/schemas/CapCents"
    CapResponse:
      type: object
      additionalProperties: false
      required: [code, data]
      properties:
        code:
          type: string
          enum: [cap_updated]
        data:
          type: object
          additionalProperties: false
          required: [customer, usage]
          properties:
            customer:
              $ref: "#/components/schemas/Customer"
            usage:
              $ref: "#/components/schemas/Usage"
    AgentsResponse:
      type: object
      additionalProperties: false
      required: [code, data]
      properties:
        code:
          type: string
          enum: [agents]
        data:
          type: object
          additionalProperties: false
          required: [agents, next]
          properties:
            agents:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [subject, firstVerifiedAt, firstSiteId]
                properties:
                  subject:
                    description: The agent, as eip155:<chain id>:<lowercase address>.
                    type: string
                    pattern: "^eip155:[1-9][0-9]*:0x[0-9a-f]{40}$"
                  firstVerifiedAt:
                    type: string
                    format: date-time
                  firstSiteId:
                    description: The site whose request counted the agent first this period.
                    type: string
                    format: uuid
            next:
              description: The cursor for the next page as after, or null on the last page.
              oneOf:
                - type: string
                - type: "null"
    CustomerResponse:
      type: object
      additionalProperties: false
      required: [code, data]
      properties:
        code:
          type: string
          enum: [customer_created, customer_updated]
        data:
          $ref: "#/components/schemas/Customer"
    SiteAudience:
      type: string
      pattern: "^[a-z0-9][a-z0-9_-]{0,63}$"
      description: What the site's agents sign in for. Taken for good by one site, and never one named in SIWA_WALLET_ORIGINS.
    SiteOrigins:
      type: array
      minItems: 1
      maxItems: 10
