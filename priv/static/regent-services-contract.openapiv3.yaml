          oneOf:
            - type: string
              enum: [unverified, verified]
            - type: "null"
        archivedAt:
          description: Null; set only on the answer to archiving the site.
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SiteCreateRequest:
      type: object
      additionalProperties: false
      required: [name, audience, environment, origins]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        audience:
          $ref: "#/components/schemas/SiteAudience"
        environment:
          type: string
          enum: [sandbox, production]
        origins:
          $ref: "#/components/schemas/SiteOrigins"
    SiteUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        origins:
          $ref: "#/components/schemas/SiteOrigins"
    SiteResponse:
      type: object
      additionalProperties: false
      required: [code, data]
      properties:
        code:
          type: string
          enum: [site, site_created, site_updated, site_archived]
        data:
          $ref: "#/components/schemas/Site"
    SitesResponse:
      type: object
      additionalProperties: false
      required: [code, data]
      properties:
        code:
          type: string
          enum: [sites]
        data:
          type: object
          additionalProperties: false
          required: [sites]
          properties:
            sites:
              type: array
              items:
                $ref: "#/components/schemas/Site"
    SiteKey:
      type: object
      additionalProperties: false
