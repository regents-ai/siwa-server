openapi: 3.1.0
info:
  title: Regent Shared Services Contract
  version: 0.1.0
  description: >
    Source-of-truth contract for shared Regent HTTP services. Shared SIWA routes
    own signed identity proof, agent registration on Base, request verification,
    health, metrics, contract discovery, and the internal keyring routes.
x-regent-capability:
  status: beta
  owner: shared-services
  money_path: true
  cli_surface: true
  mobile_surface: false
x-regent-rate-limits:
  retry_after_header: Retry-After
  tiers:
    public_unauthenticated: strict bootstrap limits before SIWA identity is proven
    verified_cli_signed_agent: higher allowance after SIWA receipt or HTTP signature verification
    internal_service: bounded by keyring HMAC credential
  cli_allowance_requires_verified_siwa: true
tags:
  - name: auth
  - name: internal
paths:
  /:
    get:
      operationId: siwaServerRoot
      tags: [auth]
      responses:
        "200":
          description: Lightweight root response for health probes that request the service root
          content:
            text/plain:
              schema:
                type: string
  /healthz:
    get:
      operationId: siwaServerHealthz
      tags: [auth]
      responses:
        "200":
          description: Simple health check response for the shared SIWA server
          content:
            text/plain:
              schema:
                type: string
  /readyz:
    get:
      operationId: siwaServerReadyz
      tags: [auth]
      responses:
        "200":
          description: Readiness checks passed for the shared SIWA server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: One or more readiness checks failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
  /metrics:
    get:
      operationId: siwaServerMetrics
      tags: [auth]
      responses:
        "200":
          description: Prometheus scrape payload for the shared SIWA server
          content:
            text/plain:
              schema:
                type: string
  /regent-services-contract.openapiv3.yaml:
    get:
      operationId: regentServicesContractSource
      tags: [auth]
      responses:
        "200":
          description: Source-of-truth contract served by the shared SIWA server
          content:
            application/yaml:
              schema:
                type: string
  /api/shared/siwa/wallet/nonce:
    post:
      operationId: createSharedWalletSiwaNonce
      tags: [auth]
      description: Issue a single-use ERC-4361 wallet challenge for an enabled audience. Ordinary wallets and smart wallets on Base can sign it. No private key is accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletSiwaNonceRequest"
      responses:
        "200":
          description: Issue a single-use ERC-4361 wallet challenge for an enabled audience
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletSiwaNonceResponse"
        "400":
          description: Malformed wallet request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Invalid signature, canonical message or expired challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Wallet audience is not enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Challenge absent or already consumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: Request body too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "415":
          description: Unsupported content type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Wallet verification unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimitError"
  /api/shared/siwa/wallet/verify:
    post:
      operationId: verifySharedWalletSiwaSession
      tags: [auth]
      description: Verify wallet control without asserting human identity or agent registration. A smart wallet's signature is checked on Base with ERC-1271, wrapped with ERC-6492 before the wallet is deployed. No private key is accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletSiwaVerifyRequest"
      responses:
        "200":
          description: Verify wallet control without asserting human identity or agent registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletSiwaVerifyResponse"
        "400":
          description: Malformed wallet request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Invalid signature, canonical message or expired challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Wallet audience is not enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Challenge absent or already consumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: Request body too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "415":
          description: Unsupported content type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Wallet verification unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Smart wallet signature lookup on Base failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimitError"
  /api/shared/siwa/nonce:
    post:
      operationId: createSharedAgentSiwaNonce
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiwaNonceRequest"
      responses:
        "200":
          description: Shared SIWA nonce issued for one app audience
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiwaNonceResponse"
        "400":
          description: Invalid SIWA nonce request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: SIWA nonce request body is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "415":
          description: SIWA nonce request content type is unsupported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimitError"
  /api/shared/siwa/verify:
    post:
      operationId: verifySharedAgentSiwaSession
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiwaVerifyRequest"
      responses:
        "200":
          description: Shared SIWA identity verified for one app audience
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiwaVerifyResponse"
        "400":
          description: Invalid SIWA verification request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Signature or nonce validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: SIWA nonce was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: SIWA verification request body is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "415":
          description: SIWA verification request content type is unsupported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: SIWA verification is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Wallet signature or agent identity lookup on Base failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimitError"
  /api/shared/siwa/http-verify:
    post:
      operationId: verifySharedSiwaHttpEnvelope
      tags: [auth]
      parameters:
        - in: header
          name: x-siwa-audience
          required: true
          schema:
            type: string
          description: App audience that the SIWA receipt must match for this protected request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiwaHttpVerifyRequest"
      responses:
        "200":
          description: Protected request envelope verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiwaHttpVerifyResponse"
        "400":
          description: Invalid envelope request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Envelope verification failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Request replay detected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: SIWA protected request envelope is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "415":
          description: SIWA protected request content type is unsupported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: SIWA HTTP verification is not configured, or the verified request could not be recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimitError"
  /api/shared/siwa/activity:
    post:
      operationId: readSharedSiwaActivity
      summary: Read one wallet's recent verified requests across Regents sites
      description: >-
        Returns up to 50 of the most recent requests that /api/shared/siwa/http-verify
        verified for the wallet, newest first, over the last 30 days. Each entry
        names the audience, method, path without its query and the time of
        verification. Request bodies, headers, receipts and signatures are never
        kept.
      tags: [internal]
      security:
        - ActivityReadToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiwaActivityRequest"
      responses:
        "200":
          description: The wallet's recent verified requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiwaActivityResponse"
        "400":
          description: Invalid activity request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: The activity read token was absent or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: Activity request is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "415":
          description: Activity request content type is unsupported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimitError"
  /api/shared/siwa/agent/register-step:
    post:
      operationId: buildAgentRegistrationStep
      summary: Build the transaction that mints an agent identity on Base
      description: >-
        Returns the unsigned transaction a wallet sends to mint its own agent
        identity in the Base ERC-8004 agent registry
        0x8004a169fb4a3325136eb29fa0ceb6d2e539a432. The wallet pays the gas.
        With agent_uri the call is register(string), otherwise register().
        Nothing is stored.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentRegisterStepRequest"
      responses:
        "200":
          description: The registration transaction for the wallet to send
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRegisterStepResponse"
        "400":
          description: Invalid registration request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: Registration request body is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "415":
          description: Registration request content type is unsupported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimitError"
  /api/shared/siwa/agent/registered:
    post:
      operationId: readAgentRegistration
      summary: Read what a sent registration did on Base
      description: >-
        Reads the transaction at the latest Base block. It must be the wallet's
        registration exactly as register-step built it for the same agent_uri.
        Until its receipt exists the answer is registration_pending; ask again
        after a couple of seconds. Once it lands the answer carries the token id
        the registry minted to the wallet, which the agent then uses to sign in
        through /api/shared/siwa/nonce and /api/shared/siwa/verify. Nothing is
        stored.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentRegisteredRequest"
      responses:
        "200":
          description: The registration is still pending, or the agent is registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRegisteredResponse"
        "400":
          description: Invalid registration request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: Registration request body is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "415":
          description: Registration request content type is unsupported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: The transaction reverted, or is not this wallet's registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimitError"
        "502":
          description: Base could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/shared/keyring/health:
    get:
      operationId: siwaKeyringHealth
      tags: [internal]
      responses:
        "200":
          description: Internal signer health response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyringHealthResponse"
        "429":
          $ref: "#/components/responses/RateLimitError"
  /api/shared/keyring/create-wallet:
    post:
      operationId: siwaKeyringCreateWallet
      tags: [internal]
      security:
        - KeyringHmacTimestamp: []
          KeyringHmacRequestId: []
          KeyringHmacSignature: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyObject"
      responses:
        "200":
          description: Wallet created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyringWalletResponse"
        "401":
          description: Internal signer authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "413":
          description: Internal signer request body is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "415":
          description: Internal signer request content type is unsupported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "422":
          description: Wallet could not be created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "429":
          $ref: "#/components/responses/RateLimitError"
  /api/shared/keyring/has-wallet:
    post:
      operationId: siwaKeyringHasWallet
      tags: [internal]
      security:
        - KeyringHmacTimestamp: []
          KeyringHmacRequestId: []
          KeyringHmacSignature: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyObject"
      responses:
        "200":
          description: Wallet presence check
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyringHasWalletResponse"
        "401":
          description: Internal signer authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "413":
          description: Internal signer request body is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "415":
          description: Internal signer request content type is unsupported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "422":
          description: Wallet presence could not be checked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "429":
          $ref: "#/components/responses/RateLimitError"
  /api/shared/keyring/get-address:
    post:
      operationId: siwaKeyringGetAddress
      tags: [internal]
      security:
        - KeyringHmacTimestamp: []
          KeyringHmacRequestId: []
          KeyringHmacSignature: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyObject"
      responses:
        "200":
          description: Wallet address lookup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyringAddressResponse"
        "401":
          description: Internal signer authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "413":
          description: Internal signer request body is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "415":
          description: Internal signer request content type is unsupported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "404":
          description: Wallet not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "422":
          description: Wallet address could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "429":
          $ref: "#/components/responses/RateLimitError"
  /api/shared/keyring/sign-message:
    post:
      operationId: siwaKeyringSignMessage
      tags: [internal]
      security:
        - KeyringHmacTimestamp: []
          KeyringHmacRequestId: []
          KeyringHmacSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeyringSignMessageRequest"
      responses:
        "200":
          description: Message signed with the internal keyring
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyringSignatureResponse"
        "400":
          description: Invalid message signing request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "401":
          description: Internal signer authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "413":
          description: Internal signer request body is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "415":
          description: Internal signer request content type is unsupported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "422":
          description: Message could not be signed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "429":
          $ref: "#/components/responses/RateLimitError"
  /api/shared/keyring/sign-raw-message:
    post:
      operationId: siwaKeyringSignRawMessage
      tags: [internal]
      security:
        - KeyringHmacTimestamp: []
          KeyringHmacRequestId: []
          KeyringHmacSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeyringSignRawMessageRequest"
      responses:
        "200":
          description: Raw payload signed with the internal keyring
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyringSignatureResponse"
        "400":
          description: Invalid raw-message signing request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "401":
          description: Internal signer authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "413":
          description: Internal signer request body is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "415":
          description: Internal signer request content type is unsupported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "422":
          description: Raw message could not be signed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "429":
          $ref: "#/components/responses/RateLimitError"
  /api/shared/keyring/sign-transaction:
    post:
      operationId: siwaKeyringSignTransaction
      tags: [internal]
      security:
        - KeyringHmacTimestamp: []
          KeyringHmacRequestId: []
          KeyringHmacSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeyringSignTransactionRequest"
      responses:
        "200":
          description: Transaction signed with the internal keyring
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyringSignedTransactionResponse"
        "400":
          description: Invalid transaction signing request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "401":
          description: Internal signer authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "413":
          description: Internal signer request body is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "415":
          description: Internal signer request content type is unsupported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "422":
          description: Transaction could not be signed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "429":
          $ref: "#/components/responses/RateLimitError"
  /api/shared/keyring/sign-authorization:
    post:
      operationId: siwaKeyringSignAuthorization
      tags: [internal]
      security:
        - KeyringHmacTimestamp: []
          KeyringHmacRequestId: []
          KeyringHmacSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeyringSignAuthorizationRequest"
      responses:
        "200":
          description: Authorization payload signed with the internal keyring
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyringSignedAuthorizationResponse"
        "400":
          description: Invalid authorization signing request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "401":
          description: Internal signer authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "413":
          description: Internal signer request body is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "415":
          description: Internal signer request content type is unsupported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "422":
          description: Authorization payload could not be signed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "429":
          $ref: "#/components/responses/RateLimitError"
components:
  securitySchemes:
    ActivityReadToken:
      type: http
      scheme: bearer
      description: Shared token, held only by Regents sites, that permits reading verified-request activity.
    KeyringHmacTimestamp:
      type: apiKey
      in: header
      name: x-keyring-timestamp
    KeyringHmacRequestId:
      type: apiKey
      in: header
      name: x-keyring-request-id
      description: Unique request identifier included in the keyring HMAC payload and consumed once within the timestamp freshness window.
    KeyringHmacSignature:
      type: apiKey
      in: header
      name: x-keyring-signature
  responses:
    RateLimitError:
      description: Too many requests
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    Address:
      type: string
      pattern: "^0x[a-fA-F0-9]{40}$"
    BaseChainId:
      type: integer
      enum: [8453]
    HexData:
      type: string
      pattern: "^0x[a-fA-F0-9]*$"
    WalletSiwaNonceRequest:
      type: object
      required: [wallet_address, chain_id, audience]
      properties:
        wallet_address:
          $ref: "#/components/schemas/Address"
        chain_id:
          $ref: "#/components/schemas/BaseChainId"
        audience:
          type: string
          minLength: 1
          maxLength: 200
      additionalProperties: false
    WalletSiwaVerifyRequest:
      type: object
      required: [wallet_address, chain_id, audience, nonce, message, signature]
      properties:
        wallet_address:
          $ref: "#/components/schemas/Address"
        chain_id:
          $ref: "#/components/schemas/BaseChainId"
        audience:
          type: string
          minLength: 1
          maxLength: 200
        nonce:
          type: string
          pattern: '^[a-f0-9]{32}$'
        message:
          type: string
          maxLength: 2048
          description: Exact server-issued ERC-4361 message; do not reconstruct it from caller fields.
        signature:
          type: string
          pattern: '^0x([a-fA-F0-9]{2})+$'
          maxLength: 8194
          description: ERC-191 personal signature from the wallet, or a smart wallet's ERC-1271 signature (ERC-6492-wrapped before deployment); never a private key.
      additionalProperties: false
    WalletSiwaNonceResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: string
          enum: [nonce_issued]
        data:
          type: object
          required: [principalType, walletAddress, chainId, audience, nonce, message, issuedAt, expiresAt]
          properties:
            principalType:
              type: string
              enum: [wallet]
            walletAddress:
              $ref: "#/components/schemas/Address"
            chainId:
              $ref: "#/components/schemas/BaseChainId"
            audience:
              type: string
            nonce:
              type: string
            message:
              type: string
              description: Canonical server-issued ERC-4361 message to review and sign.
            issuedAt:
              type: string
              format: date-time
            expiresAt:
              type: string
              format: date-time
          additionalProperties: false
      additionalProperties: false
    WalletSiwaVerifyResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: string
          enum: [wallet_verified]
        data:
          type: object
          required: [verified, principalType, walletAddress, chainId, audience, keyId, signatureScheme, proof, receipt, receiptExpiresAt]
          properties:
            verified:
              type: boolean
              enum: [true]
            principalType:
              type: string
              enum: [wallet]
            walletAddress:
              $ref: "#/components/schemas/Address"
            chainId:
              $ref: "#/components/schemas/BaseChainId"
            audience:
              type: string
            keyId:
              type: string
            signatureScheme:
              type: string
              enum: [evm_personal_sign]
            proof:
              type: string
              enum: [wallet_signature]
            receipt:
              type: string
              description: Short-lived siwa_wallet_receipt bound to address, chain and audience. It proves neither registry ownership nor human Privy identity.
            receiptExpiresAt:
              type: string
              format: date-time
          additionalProperties: false
      additionalProperties: false
    WalletPrincipal:
      type: object
      required: [kind, wallet_address, chain_id, audience]
      properties:
        kind:
          type: string
          enum: [wallet]
        wallet_address:
          $ref: "#/components/schemas/Address"
        chain_id:
          $ref: "#/components/schemas/BaseChainId"
        audience:
          type: string
      additionalProperties: false
    WalletSiwaHttpVerifyResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: string
          enum: [http_envelope_valid]
        data:
          type: object
          required: [verified, walletAddress, chainId, keyId, principal, receiptExpiresAt, requiredHeaders, requiredCoveredComponents, coveredComponents]
          properties:
            verified:
              type: boolean
              enum: [true]
            walletAddress:
              $ref: "#/components/schemas/Address"
            chainId:
              $ref: "#/components/schemas/BaseChainId"
            keyId:
              type: string
            principal:
              $ref: "#/components/schemas/WalletPrincipal"
            receiptExpiresAt:
              type: string
              format: date-time
            requiredHeaders:
              type: array
              items:
                type: string
            requiredCoveredComponents:
              type: array
              items:
                type: string
            coveredComponents:
              type: array
              items:
                type: string
          additionalProperties: false
      additionalProperties: false
    SiwaNonceRequest:
      type: object
      required: [wallet_address, chain_id, registry_address, token_id, audience]
      properties:
        wallet_address:
          $ref: "#/components/schemas/Address"
        chain_id:
          $ref: "#/components/schemas/BaseChainId"
        registry_address:
          $ref: "#/components/schemas/Address"
        token_id:
          type: string
        audience:
          type: string
      additionalProperties: false
    SiwaNonceResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: string
          enum: [nonce_issued]
        data:
          type: object
          required: [nonce, walletAddress, chainId, registryAddress, tokenId, audience, expiresAt]
          properties:
            nonce:
              type: string
            walletAddress:
              $ref: "#/components/schemas/Address"
            chainId:
              $ref: "#/components/schemas/BaseChainId"
            registryAddress:
              $ref: "#/components/schemas/Address"
            tokenId:
              type: string
            audience:
              type: string
            expiresAt:
              type: string
              format: date-time
          additionalProperties: false
        meta:
          $ref: "#/components/schemas/LooseObject"
      additionalProperties: false
    SiwaVerifyRequest:
      type: object
      required: [wallet_address, chain_id, registry_address, token_id, audience, nonce, message, signature]
      properties:
        wallet_address:
          $ref: "#/components/schemas/Address"
        chain_id:
          $ref: "#/components/schemas/BaseChainId"
        registry_address:
          $ref: "#/components/schemas/Address"
        token_id:
          type: string
        audience:
          type: string
        nonce:
          type: string
        message:
          type: string
        signature:
          $ref: "#/components/schemas/HexData"
      additionalProperties: false
    SiwaVerifyResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: string
          enum: [siwa_verified]
        data:
          type: object
          required: [verified, walletAddress, chainId, registryAddress, tokenId, agentId, audience, nonce, keyId, signatureScheme, receipt, receiptIssuedAt, receiptExpiresAt]
          properties:
            verified:
              type: boolean
              enum: [true]
            walletAddress:
              $ref: "#/components/schemas/Address"
            chainId:
              $ref: "#/components/schemas/BaseChainId"
            registryAddress:
              $ref: "#/components/schemas/Address"
            tokenId:
              type: string
            agentId:
              type: string
            audience:
              type: string
            nonce:
              type: string
            keyId:
              type: string
            signatureScheme:
              type: string
            receipt:
              type: string
            receiptIssuedAt:
              type: string
              format: date-time
            receiptExpiresAt:
              type: string
              format: date-time
          additionalProperties: false
        meta:
          $ref: "#/components/schemas/LooseObject"
      additionalProperties: false
    SiwaHttpVerifyRequest:
      type: object
      required: [method, path, headers]
      properties:
        method:
          type: string
        path:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
        body:
          type: string
      additionalProperties: false
    SiwaHttpVerifyResponse:
      description: Legacy registered-agent result, or an explicit wallet principal only for server-enabled audiences. Missing registry claims never select wallet mode. Wallet signatures bind the exact method, path including query, receipt, chain, address, timestamp, nonce and body digest; callers must sign a fresh HTTP envelope when recovering an existing payment intent.
      oneOf:
        - $ref: "#/components/schemas/AgentSiwaHttpVerifyResponse"
        - $ref: "#/components/schemas/WalletSiwaHttpVerifyResponse"
    AgentSiwaHttpVerifyResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: string
          enum: [http_envelope_valid]
        data:
          type: object
          required: [verified, walletAddress, chainId, keyId, agent_claims, receiptExpiresAt, requiredHeaders, requiredCoveredComponents, coveredComponents]
          properties:
            verified:
              type: boolean
              enum: [true]
            walletAddress:
              $ref: "#/components/schemas/Address"
            chainId:
              $ref: "#/components/schemas/BaseChainId"
            keyId:
              type: string
            agent_claims:
              $ref: "#/components/schemas/AgentClaims"
            receiptExpiresAt:
              type: string
              format: date-time
            requiredHeaders:
              type: array
              items:
                type: string
            requiredCoveredComponents:
              type: array
              items:
                type: string
            coveredComponents:
              type: array
              items:
                type: string
          additionalProperties: false
        meta:
          $ref: "#/components/schemas/LooseObject"
      additionalProperties: false
    AgentRegisterStepRequest:
      type: object
      required: [wallet_address]
      properties:
        wallet_address:
          $ref: "#/components/schemas/Address"
        agent_uri:
          type: string
          description: The agent's registration file URI, stored on chain with the identity.
      additionalProperties: false
    AgentRegisterStepResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: string
          enum: [registration_step]
        data:
          type: object
          required: [chainId, from, to, data, value]
          properties:
            chainId:
              $ref: "#/components/schemas/BaseChainId"
            from:
              $ref: "#/components/schemas/Address"
            to:
              $ref: "#/components/schemas/Address"
            data:
              $ref: "#/components/schemas/HexData"
            value:
              $ref: "#/components/schemas/HexData"
          additionalProperties: false
      additionalProperties: false
    AgentRegisteredRequest:
      type: object
      required: [wallet_address, tx_hash]
      properties:
        wallet_address:
          $ref: "#/components/schemas/Address"
        agent_uri:
          type: string
          description: The same agent_uri given to register-step, if any.
        tx_hash:
          type: string
          pattern: "^0x[a-fA-F0-9]{64}$"
      additionalProperties: false
    AgentRegisteredResponse:
      oneOf:
        - type: object
          required: [code, data]
          properties:
            code:
              type: string
              enum: [registration_pending]
            data:
              type: object
              required: [txHash]
              properties:
                txHash:
                  type: string
              additionalProperties: false
          additionalProperties: false
        - type: object
          required: [code, data]
          properties:
            code:
              type: string
              enum: [agent_registered]
            data:
              type: object
              required: [txHash, walletAddress, chainId, registryAddress, tokenId, agentId]
              properties:
                txHash:
                  type: string
                walletAddress:
                  $ref: "#/components/schemas/Address"
                chainId:
                  $ref: "#/components/schemas/BaseChainId"
                registryAddress:
                  $ref: "#/components/schemas/Address"
                tokenId:
                  type: string
                agentId:
                  type: string
              additionalProperties: false
          additionalProperties: false
    AgentClaims:
      type: object
      required: [agent_id, wallet_address, chain_id, registry_address, token_id]
      properties:
        agent_id:
          type: string
        wallet_address:
          $ref: "#/components/schemas/Address"
        chain_id:
          $ref: "#/components/schemas/BaseChainId"
        registry_address:
          $ref: "#/components/schemas/Address"
        token_id:
          type: string
        audience:
          type: string
      additionalProperties: true
    EmptyObject:
      type: object
      additionalProperties: false
    KeyringHealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
      additionalProperties: false
    KeyringWalletResponse:
      type: object
      required: [public_key, address, signer_type]
      properties:
        public_key:
          $ref: "#/components/schemas/HexData"
        address:
          $ref: "#/components/schemas/Address"
        signer_type:
          type: string
          enum: [eoa]
      additionalProperties: false
    KeyringHasWalletResponse:
      type: object
      required: [has_wallet]
      properties:
        has_wallet:
          type: boolean
      additionalProperties: false
    KeyringAddressResponse:
      type: object
      required: [address]
      properties:
        address:
          $ref: "#/components/schemas/Address"
      additionalProperties: false
    KeyringSignMessageRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
      additionalProperties: false
    KeyringSignRawMessageRequest:
      type: object
      required: [payload]
      properties:
        payload:
          type: string
      additionalProperties: false
    KeyringWalletActionEnvelope:
      type: object
      required: [chain_id, to, value, data, expected_signer, expires_at, risk_copy, idempotency_key]
      properties:
        chain_id:
          $ref: "#/components/schemas/BaseChainId"
        to:
          $ref: "#/components/schemas/Address"
        value:
          $ref: "#/components/schemas/HexData"
        data:
          $ref: "#/components/schemas/HexData"
        expected_signer:
          $ref: "#/components/schemas/Address"
        expires_at:
          type: string
          format: date-time
        risk_copy:
          type: string
          minLength: 1
        idempotency_key:
          type: string
          minLength: 16
          maxLength: 128
          pattern: "^[A-Za-z0-9._:-]+$"
      additionalProperties: false
    KeyringSignTransactionRequest:
      type: object
      required: [transaction]
      properties:
        transaction:
          $ref: "#/components/schemas/KeyringWalletActionEnvelope"
      additionalProperties: false
    KeyringSignAuthorizationRequest:
      type: object
      required: [authorization]
      properties:
        authorization:
          $ref: "#/components/schemas/KeyringWalletActionEnvelope"
      additionalProperties: false
    KeyringSignatureResponse:
      type: object
      required: [signature]
      properties:
        signature:
          $ref: "#/components/schemas/HexData"
      additionalProperties: false
    KeyringRawSignature:
      type: object
      required: [purpose, signer_type, digest, signature, public_key, address]
      properties:
        purpose:
          type: string
          enum: [raw]
        signer_type:
          type: string
          enum: [eoa]
        digest:
          $ref: "#/components/schemas/HexData"
        signature:
          $ref: "#/components/schemas/HexData"
        public_key:
          $ref: "#/components/schemas/HexData"
        address:
          $ref: "#/components/schemas/Address"
      additionalProperties: false
    KeyringSignedTransactionResponse:
      type: object
      required: [transaction, signature]
      properties:
        transaction:
          $ref: "#/components/schemas/KeyringWalletActionEnvelope"
        signature:
          $ref: "#/components/schemas/KeyringRawSignature"
      additionalProperties: false
    KeyringSignedAuthorizationResponse:
      type: object
      required: [authorization, signature]
      properties:
        authorization:
          $ref: "#/components/schemas/KeyringWalletActionEnvelope"
        signature:
          $ref: "#/components/schemas/KeyringRawSignature"
      additionalProperties: false
    ReadinessResponse:
      type: object
      required: [ready, checks]
      properties:
        ready:
          type: boolean
        failures:
          type: object
          description: Reason strings for each failing readiness check
          additionalProperties:
            type: string
        checks:
          type: object
          required:
            - database
            - endpoint_secret
            - receipt_secret
            - keyring_backend
            - keyring_password
            - keyring_secret
            - keystore_path
            - base_rpc_url
            - base_rpc_chain_id
          properties:
            database:
              type: boolean
            endpoint_secret:
              type: boolean
            receipt_secret:
              type: boolean
            keyring_backend:
              type: boolean
            keyring_password:
              type: boolean
            keyring_secret:
              type: boolean
            keystore_path:
              type: boolean
            base_rpc_url:
              type: boolean
            base_rpc_chain_id:
              type: boolean
          additionalProperties: false
      additionalProperties: false
    LooseObject:
      type: object
      additionalProperties: true
    ServiceError:
      type: object
      required: [code, message]
      additionalProperties: true
      properties:
        code:
          type: string
        message:
          type: string
    SiwaActivityRequest:
      type: object
      additionalProperties: false
      required: [wallet_address, since]
      properties:
        wallet_address:
          $ref: "#/components/schemas/Address"
        since:
          type: string
          format: date-time
          description: Only requests verified at or after this time are returned.
    SiwaActivityResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [activity]
          properties:
            activity:
              type: array
              maxItems: 50
              items:
                $ref: "#/components/schemas/SiwaActivityEntry"
    SiwaActivityEntry:
      type: object
      additionalProperties: false
      required: [audience, method, path, occurred_at]
      properties:
        audience:
          type: string
          minLength: 1
        method:
          type: string
          minLength: 1
        path:
          type: string
          pattern: "^/[^?]*$"
        occurred_at:
          type: string
          format: date-time
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ServiceError"
      additionalProperties: true
    SimpleError:
      type: object
      required: [error]
      properties:
        error:
          type: string
      additionalProperties: false
