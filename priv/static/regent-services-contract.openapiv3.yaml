      properties:
        id:
          type: string
          format: uuid
        prefix:
          type: string
          pattern: "^siwa_sk_(test|live)_[A-Za-z0-9_-]{6}$"
          description: The key's first 19 characters, to tell keys apart.
        createdAt:
          type: string
          format: date-time
        revokedAt:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
    SiteKeyResponse:
      type: object
      additionalProperties: false
      required: [code, data]
      properties:
        code:
          type: string
          enum: [site_key_revoked]
        data:
          $ref: "#/components/schemas/SiteKey"
    SiteKeysResponse:
      type: object
      additionalProperties: false
      required: [code, data]
      properties:
        code:
          type: string
          enum: [site_keys]
        data:
          type: object
          additionalProperties: false
          required: [keys]
          properties:
            keys:
              type: array
              items:
                $ref: "#/components/schemas/SiteKey"
    SiteKeyCreatedResponse:
      type: object
      additionalProperties: false
      required: [code, data]
      properties:
        code:
          type: string
          enum: [site_key_created]
        data:
          type: object
          additionalProperties: false
          required: [id, prefix, key, createdAt, revokedAt]
          properties:
            id:
              type: string
              format: uuid
            prefix:
              type: string
              pattern: "^siwa_sk_(test|live)_[A-Za-z0-9_-]{6}$"
            key:
              type: string
              pattern: "^siwa_sk_(test|live)_[A-Za-z0-9_-]{43}$"
              description: The server key, shown only here. siwa_sk_test_ for a sandbox site, siwa_sk_live_ for a production one.
            createdAt:
              type: string
              format: date-time
            revokedAt:
              type: "null"
