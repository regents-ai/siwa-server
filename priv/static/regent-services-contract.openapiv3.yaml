      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        audience:
          $ref: "#/components/schemas/SiteAudience"
        environment:
          type: string
          enum: [sandbox, production]
        origins:
          $ref: "#/components/schemas/SiteOrigins"
        originProof:
