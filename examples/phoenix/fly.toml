app = "siwa-demo"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "5s"

[build]
  dockerfile = "Dockerfile"

# The server key is a Fly secret, never a line here:
#   fly secrets set SIWA_SERVER_KEY=siwa_sk_live_...
[env]
  PHX_HOST = "demo.regents.sh"
  PHX_SERVER = "true"
  PORT = "8080"
  SIWA_SERVICE = "https://siwa.regents.sh"
  # The live site's handle and its address-proof token, both from its Sites page.
  # Neither is a secret.
  SIWA_HANDLE = "demo"
  SIWA_SITE_TOKEN = "siwa_site_3eedbf75c2be461b99537ee99c6d693b"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "off"
  min_machines_running = 1
  processes = ["app"]

# Fly's check reaches the machine over plain HTTP. It asks as localhost, which
# force_ssl in config/prod.exs answers instead of redirecting.
[[http_service.checks]]
  grace_period = "30s"
  interval = "10s"
  method = "GET"
  path = "/healthz"
  protocol = "http"
  timeout = "2s"

  [http_service.checks.headers]
    Host = "localhost"

# One small machine: the site stores nothing and asks the SIWA service for every check.
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
